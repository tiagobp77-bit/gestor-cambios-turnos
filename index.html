                            Toca <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display: 'inline', margin: '0 2px', verticalAlign: 'text-bottom'}}><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle></svg>, luego el ícono de Compartir <span style={{fontSize: '18px', margin: '0 2px'}}>⍐</span> y abajo selecciona <strong>"Agregar a inicio"</strong> ➕.
                        </p>
                    ) : (
                        <p style={{ margin: 0, fontSize: '14px', color: '#555', lineHeight: '1.4' }}>
                            Toca los tres puntos <strong style={{fontSize: '18px', margin: '0 2px'}}>⋮</strong> en la esquina superior del navegador y selecciona <strong>"Agregar a la pantalla principal"</strong> ➕.
                        </p>
                    )}
                </div>
            );
        };

        const CustomCalendar = ({ value, onChange, allowedTypes, isDateAllowed }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(value ? new Date(value + 'T12:00:00') : new Date());
            const [showYearPicker, setShowYearPicker] = useState(false);
            const [yearPage, setYearPage] = useState(viewDate.getFullYear());
            
            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();

            useEffect(() => { if (!showYearPicker) setYearPage(viewDate.getFullYear()); }, [viewDate, showYearPicker]);

            const handlePrev = (e) => { e.stopPropagation(); if (showYearPicker) setYearPage(prev => prev - 12); else setViewDate(new Date(viewYear, viewMonth - 1, 1)); };
            const handleNext = (e) => { e.stopPropagation(); if (showYearPicker) setYearPage(prev => prev + 12); else setViewDate(new Date(viewYear, viewMonth + 1, 1)); };

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const startOffset = (firstDay + 6) % 7; 
            const now = new Date();
            const todayString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const days = Array(startOffset).fill(null);
            for (let i = 1; i <= daysInMonth; i++) days.push(i);
            const MONTH_NAMES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            return (
                <div className="relative w-full">
                    <div onClick={() => setIsOpen(true)} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer flex justify-between items-center text-slate-700 hover:bg-slate-100 transition-colors">
                        <span>{value ? value : "Seleccionar fecha..."}</span>
                        <IconCalendar size={18} />
                    </div>
                    {isOpen && (
                        <div className="absolute z-50 mt-1 bg-white border border-slate-200 shadow-2xl rounded-xl p-4 w-72 sm:w-80 left-0">
                            <div className="fixed inset-0 z-40" onClick={(e) => { e.stopPropagation(); setIsOpen(false); setShowYearPicker(false); }}></div>
                            <div className="relative z-50">
                                <div className="flex justify-between items-center mb-4">
                                    <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&lt;</button>
                                    <span onClick={(e) => { e.stopPropagation(); setShowYearPicker(!showYearPicker); }} className="font-bold text-slate-700 capitalize cursor-pointer hover:text-keralty-blue px-2 py-1 rounded hover:bg-slate-50 transition-colors">
                                        {showYearPicker ? `${yearPage - 5} - ${yearPage + 6}` : `${MONTH_NAMES[viewMonth]} ${viewYear}`}
                                    </span>
                                    <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&gt;</button>
                                </div>
                                {showYearPicker ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        {Array.from({ length: 12 }, (_, i) => yearPage - 5 + i).map(y => (
                                            <div key={y} onClick={(e) => { e.stopPropagation(); setViewDate(new Date(y, viewMonth, 1)); setShowYearPicker(false); }} className={`h-10 flex items-center justify-center rounded text-sm font-medium cursor-pointer transition-colors ${y === viewYear ? 'bg-keralty-blue text-white shadow-sm' : 'bg-slate-50 text-slate-700 hover:bg-slate-200'}`}>{y}</div>
                                        ))}
                                    </div>
                                ) : (
                                    <>
                                        <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-slate-400"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {days.map((day, idx) => {
                                                if (!day) return <div key={idx}></div>;
                                                const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                                const dayType = getDayType(dateStr);
                                                const isPast = dateStr < todayString;
                                                const isAllowed = allowedTypes.includes(dayType) && !isPast && (!isDateAllowed || isDateAllowed(dateStr));
                                                
                                                let colorClasses = !isAllowed ? "bg-slate-50 text-slate-300 cursor-not-allowed opacity-40" : 
                                                    (dayType === 'festivo' ? "bg-purple-100 text-purple-800 hover:bg-purple-200 border-purple-200 border" : 
                                                    (dayType === 'domingo' ? "bg-red-100 text-red-800 hover:bg-red-200 border-red-200 border" : 
                                                    (dayType === 'sabado' ? "bg-blue-100 text-blue-800 hover:bg-blue-200 border-blue-200 border" : "bg-white text-slate-700 hover:bg-slate-100 border-slate-200 border")));

                                                if (value === dateStr) colorClasses += " ring-2 ring-keralty-blue ring-offset-1";

                                                return <div key={idx} onClick={(e) => { e.stopPropagation(); if (isAllowed) { onChange(dateStr); setIsOpen(false); } }} className={`h-8 sm:h-9 flex items-center justify-center rounded text-sm font-medium cursor-pointer transition-colors ${colorClasses}`}>{day}</div>;
                                            })}
                                        </div>
                                        <div className="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-[10px] sm:text-xs text-slate-500 font-medium">
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-white border border-slate-300 mr-1.5"></span> Hábil</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-blue-300 mr-1.5"></span> Sábado</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-red-300 mr-1.5"></span> Domingo</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-purple-300 mr-1.5"></span> Festivo</div>
                                        </div>
                                        {allowedTypes.length < 4 && (<div className="mt-3 text-[10.5px] text-amber-700 bg-amber-50 p-2 rounded-lg flex items-start leading-tight border border-amber-100"><IconAlert size={14} className="mr-1.5 shrink-0 mt-0.5" /> El tipo de jornada seleccionada aplicó filtros de días a este calendario.</div>)}
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        const MultiDateCalendar = ({ selectedDates, onChange, allowedTypes, isDateAllowed }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [showYearPicker, setShowYearPicker] = useState(false);
            const [yearPage, setYearPage] = useState(viewDate.getFullYear());

            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const startOffset = (firstDay + 6) % 7;
            const today = new Date();
            const todayString = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
            const days = Array(startOffset).fill(null);
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            for (let day = 1; day <= daysInMonth; day++) days.push(day);

            useEffect(() => {
                if (!showYearPicker) setYearPage(viewDate.getFullYear());
            }, [viewDate, showYearPicker]);

            const toggleDate = (dateString) => {
                const nextDates = selectedDates.includes(dateString)
                    ? selectedDates.filter(date => date !== dateString)
                    : [...selectedDates, dateString].sort();
                onChange(nextDates);
            };

            const handlePrev = () => {
                if (showYearPicker) setYearPage(current => current - 12);
                else setViewDate(new Date(viewYear, viewMonth - 1, 1));
            };

            const handleNext = () => {
                if (showYearPicker) setYearPage(current => current + 12);
                else setViewDate(new Date(viewYear, viewMonth + 1, 1));
            };

            return (
                <div className="relative">
                    <button type="button" onClick={() => setIsOpen(true)} className="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg flex justify-between items-center text-left text-slate-700 hover:bg-slate-50 transition-colors">
                        <span>{selectedDates.length ? selectedDates.length + " fecha(s) adicional(es) seleccionada(s)" : "Seleccionar fechas adicionales..."}</span>
                        <IconCalendar size={18} />
                    </button>
                    {isOpen && (
                        <div className="absolute z-50 mt-1 bg-white border border-slate-200 shadow-2xl rounded-xl p-4 w-72 sm:w-80 left-0">
                            <div className="fixed inset-0 z-40" onClick={() => { setIsOpen(false); setShowYearPicker(false); }}></div>
                            <div className="relative z-50">
                                <div className="flex justify-between items-center mb-3">
                                    <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&lt;</button>
                                    <button type="button" onClick={() => setShowYearPicker(!showYearPicker)} className="font-bold text-slate-700 capitalize hover:text-keralty-blue px-2 py-1 rounded hover:bg-slate-50 transition-colors">
                                        {showYearPicker ? (yearPage - 5) + " - " + (yearPage + 6) : monthNames[viewMonth] + " " + viewYear}
                                    </button>
                                    <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&gt;</button>
                                </div>
                                {showYearPicker ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        {Array.from({ length: 12 }, (_, index) => yearPage - 5 + index).map(year => (
                                            <button type="button" key={year} onClick={() => { setViewDate(new Date(year, viewMonth, 1)); setShowYearPicker(false); }} className={`h-10 rounded text-sm font-medium transition-colors ${year === viewYear ? 'bg-keralty-blue text-white shadow-sm' : 'bg-slate-50 text-slate-700 hover:bg-slate-200'}`}>{year}</button>
                                        ))}
                                    </div>
                                ) : (
                                    <>
                                        <p className="text-xs text-slate-500 mb-3 leading-relaxed">Selecciona todos los días en los que se repetirá exactamente este cambio. Puedes navegar entre meses.</p>
                                        <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-slate-400"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {days.map((day, index) => {
                                                if (!day) return <div key={index}></div>;
                                                const dateString = viewYear + "-" + String(viewMonth + 1).padStart(2, '0') + "-" + String(day).padStart(2, '0');
                                                const canSelect = allowedTypes.includes(getDayType(dateString)) && dateString >= todayString && (!isDateAllowed || isDateAllowed(dateString));
                                                const isSelected = selectedDates.includes(dateString);
                                                const classes = !canSelect
                                                    ? "bg-slate-50 text-slate-300 cursor-not-allowed opacity-40"
                                                    : (isSelected ? "bg-keralty-green text-white ring-2 ring-keralty-green ring-offset-1" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200");

                                                return <button type="button" key={index} disabled={!canSelect} onClick={() => toggleDate(dateString)} className={`h-8 sm:h-9 flex items-center justify-center rounded text-sm font-medium transition-colors ${classes}`}>{day}</button>;
                                            })}
                                        </div>
                                        {selectedDates.length > 0 && (
                                            <button type="button" onClick={() => onChange([])} className="mt-3 text-xs font-medium text-red-600 hover:text-red-700">Limpiar fechas adicionales</button>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    {selectedDates.length > 0 && (
                        <p className="mt-2 text-xs text-slate-500 leading-relaxed">{selectedDates.join(", ")}</p>
                    )}
                </div>
            );
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-amber-500' : 'bg-keralty-green');
            const Icon = type === 'error' || type === 'warning' ? IconAlert : IconCheck;
            return <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 animate-bounce-short z-50`}><Icon /><span className="font-medium">{message}</span></div>;
        };

        const ShiftEntry = ({ shift, index, updateShift, removeShift, doctorsList, isLoadingDoctors, errors = {}, validationCycle }) => {
            const isRoomNotRequired = isRoomNotRequiredForType(shift.type);
            const currentDayType = getDayType(shift.date);
            const allowedDays = getAllowedDayTypes(shift.type);
            const additionalDates = shift.additionalDates || [];
            const additionalDatesKey = additionalDates.join("|");
            const errorClass = (field) => errors[field] ? "field-error field-error-shake" : "";
            const visibleShiftType = formatShiftLabel(shift.type);
            const sameWeekRepeatTypes = ["Entre semana AM", "Entre semana PM", "Extendido 1", "Extendido 2", "Extendido 3"];
            const repeatMustStayInWeek = sameWeekRepeatTypes.includes(visibleShiftType);
            const repeatBlockedByWeekend = shift.type.includes("Fin de semana");
            const roomRestriction = shift.room && !isRoomNotRequired
                ? getRoomRestriction(shift.room, shift.date, shift.person, doctorsList)
                : "";
            const hasCompleteBase = Boolean(
                shift.person &&
                shift.type &&
                shift.date &&
                (isRoomNotRequired || shift.room) &&
                allowedDays.includes(currentDayType) &&
                !roomRestriction &&
                (isRoomNotRequired || isRoomAvailableOnDate(shift.room, shift.date))
            );
            const canEnableRepeat = hasCompleteBase && !repeatBlockedByWeekend;
            const repeatAllowedDays = repeatMustStayInWeek ? ["habil"] : allowedDays;

            useEffect(() => {
                if (isRoomNotRequired && shift.room !== "") updateShift(shift.id, "room", "");
                if (shift.date && !allowedDays.includes(currentDayType)) updateShift(shift.id, "date", "");
                if (shift.room && getRoomRestriction(shift.room, shift.date, shift.person, doctorsList)) updateShift(shift.id, "room", "");
            }, [shift.type, shift.date, shift.person, isRoomNotRequired, currentDayType]);

            useEffect(() => {
                const validAdditionalDates = additionalDates.filter(date => (
                    date !== shift.date &&
                    repeatAllowedDays.includes(getDayType(date)) &&
                    (!repeatMustStayInWeek || isSameCalendarWeek(date, shift.date)) &&
                    (isRoomNotRequired || !shift.room || isRoomAvailableOnDate(shift.room, date))
                ));
                if (validAdditionalDates.length !== additionalDates.length) updateShift(shift.id, "additionalDates", validAdditionalDates);
            }, [shift.date, shift.type, shift.room, isRoomNotRequired, additionalDatesKey]);

            useEffect(() => {
                if (!canEnableRepeat && (shift.repeatToOtherDates || additionalDates.length > 0)) {
                    updateShift(shift.id, "repeatToOtherDates", false);
                    updateShift(shift.id, "additionalDates", []);
                }
            }, [canEnableRepeat]);

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-4 transition-all hover:shadow-md">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-50">
                        <h4 className="font-semibold text-keralty-blue flex items-center"><span className="text-keralty-green mr-2"><IconActivity /></span>Cambio de Turno #{index + 1}</h4>
                        {index > 0 && <button type="button" onClick={() => removeShift(shift.id)} className="text-red-400 hover:text-red-600 p-1 rounded-full hover:bg-red-50 transition-colors"><IconTrash /></button>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="space-y-2" data-validation-error={errors.person ? "true" : undefined}>
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconUser /></span> Persona Asignada</label>
                            <div className="relative">
                                <select key={"person-" + validationCycle} value={shift.person} onChange={(event) => updateShift(shift.id, "person", event.target.value)} className={`w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 ${errorClass("person")}`}>
                                    <option value="">{isLoadingDoctors ? "Cargando..." : "Seleccione..."}</option>
                                    <DoctorOptions doctorsList={doctorsList} />
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                            {errors.person && <p className="text-xs font-semibold text-red-600">{errors.person}</p>}
                        </div>

                        <div className="space-y-2" data-validation-error={errors.type ? "true" : undefined}>
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconClock /></span> Tipo de Jornada</label>
                            <div className="relative">
                                <select key={"type-" + validationCycle} value={shift.type} onChange={(event) => updateShift(shift.id, "type", event.target.value)} className={`w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 ${errorClass("type")}`}>
                                    <option value="">Seleccione jornada...</option>
                                    {Object.entries(SHIFT_TYPES).map(([category, types]) => <optgroup key={category} label={category}>{types.map(type => <option key={type} value={category + " - " + type}>{type}</option>)}</optgroup>)}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                            {errors.type && <p className="text-xs font-semibold text-red-600">{errors.type}</p>}
                        </div>

                        <div className="space-y-2" data-validation-error={errors.date ? "true" : undefined}>
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconCalendar /></span> Fecha del Turno</label>
                            <div key={"date-" + validationCycle} className={`rounded-lg ${errorClass("date")}`}>
                                <CustomCalendar value={shift.date} onChange={(date) => updateShift(shift.id, "date", date)} allowedTypes={allowedDays} />
                            </div>
                            {errors.date && <p className="text-xs font-semibold text-red-600">{errors.date}</p>}
                        </div>

                        <div className="space-y-2" data-validation-error={errors.room ? "true" : undefined}>
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconLayout /></span> Sala Asignada</label>
                            <div className="relative">
                                <select key={"room-" + validationCycle} value={shift.room} onChange={(event) => updateShift(shift.id, "room", event.target.value)} disabled={isRoomNotRequired} className={`w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 ${isRoomNotRequired ? "opacity-50 cursor-not-allowed bg-slate-200" : ""} ${errorClass("room")}`}>
                                    <option value="">{isRoomNotRequired ? "No aplica" : "Seleccione sala..."}</option>
                                    {Object.entries(ROOMS_GROUPED).map(([groupName, rooms]) => (
                                        <optgroup key={groupName} label={groupName}>
                                            {rooms.map(room => {
                                                const reason = getRoomRestriction(room, shift.date, shift.person, doctorsList);
                                                return <option key={room} value={room} disabled={Boolean(reason)}>{room}{reason ? " (" + reason + ")" : ""}</option>;
                                            })}
                                        </optgroup>
                                    ))}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                            {errors.room && <p className="text-xs font-semibold text-red-600">{errors.room}</p>}
                        </div>

                        <div className="md:col-span-2 lg:col-span-4 border-t border-slate-100 pt-5">
                            <label className={`flex items-start gap-3 text-sm font-medium ${canEnableRepeat ? "cursor-pointer text-slate-700" : "cursor-not-allowed text-slate-400"}`}>
                                <input type="checkbox" checked={Boolean(shift.repeatToOtherDates)} disabled={!canEnableRepeat} onChange={(event) => {
                                    updateShift(shift.id, "repeatToOtherDates", event.target.checked);
                                    if (!event.target.checked) updateShift(shift.id, "additionalDates", []);
                                }} className="mt-0.5 w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue disabled:opacity-40 disabled:cursor-not-allowed" />
                                <span>¿Quieres repetir este cambio en otras fechas?</span>
                            </label>
                            {!hasCompleteBase && <p className="mt-2 ml-7 text-xs text-amber-700">Completa primero médico, jornada, fecha y sala para habilitar esta opción.</p>}
                            {hasCompleteBase && repeatBlockedByWeekend && <p className="mt-2 ml-7 text-xs text-amber-700">Esta opción no está disponible para jornadas de fin de semana porque la sala puede cambiar cada día.</p>}
                            <details className="mt-2 ml-7 text-xs text-slate-500">
                                <summary className="cursor-pointer font-semibold text-keralty-blue">¿Qué es esto?</summary>
                                <p className="mt-2 leading-relaxed">Esta opción te permite elegir múltiples días rápidamente sin necesidad de hacer los cambios uno por uno; la misma persona, el mismo tipo de jornada y la misma sala se conservarán al repetir fechas. Si quieres hacer cambios múltiples con diferentes salas y diferentes médicos, usa la opción de Cambios Múltiples en el menú anterior.</p>
                            </details>
                            {shift.repeatToOtherDates && (
                                <div key={"additional-" + validationCycle} data-validation-error={errors.additionalDates ? "true" : undefined} className={`mt-4 p-4 bg-blue-50/60 border border-blue-100 rounded-lg ${errorClass("additionalDates")}`}>
                                    <label className="text-sm font-medium text-keralty-blue block mb-2">Fechas adicionales</label>
                                    <MultiDateCalendar
                                        selectedDates={additionalDates}
                                        onChange={(dates) => updateShift(shift.id, "additionalDates", dates)}
                                        allowedTypes={repeatAllowedDays}
                                        isDateAllowed={(date) => (
                                            date !== shift.date &&
                                            (!repeatMustStayInWeek || isSameCalendarWeek(date, shift.date)) &&
                                            (isRoomNotRequired || !shift.room || isRoomAvailableOnDate(shift.room, date))
                                        )}
                                    />
                                    {repeatMustStayInWeek && <p className="mt-2 text-xs text-slate-500">Solo puedes elegir días hábiles de la misma semana de la fecha inicial.</p>}
                                    {errors.additionalDates && <p className="mt-2 text-xs font-semibold text-red-600">{errors.additionalDates}</p>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };


        const DashboardChoices = ({ onChoose }) => (
            <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-keralty-blue px-6 py-4 flex items-center">
                    <span className="text-keralty-green mr-2"><IconFileText /></span>
                    <h2 className="text-lg font-semibold text-white">Nuevas Solicitudes</h2>
                </div>
                <div className="p-6 bg-slate-50">
                    <p className="text-sm text-slate-600 mb-5">Elige cómo quieres registrar tus cambios de turno.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button type="button" onClick={() => onChoose('individual')} className="action-card text-left bg-white border border-slate-200 rounded-lg p-6 focus:outline-none focus:ring-2 focus:ring-keralty-blue">
                            <span className="w-11 h-11 rounded-lg bg-blue-50 text-keralty-blue flex items-center justify-center mb-4"><IconFileText size={22} /></span>
                            <h3 className="text-lg font-bold text-keralty-blue">Realizar Cambios Individuales</h3>
                            <p className="mt-2 text-sm text-slate-500 leading-relaxed">Registra uno o varios cambios con el formato habitual.</p>
                        </button>
                        <button type="button" onClick={() => onChoose('multiple')} className="action-card text-left bg-white border border-slate-200 rounded-lg p-6 focus:outline-none focus:ring-2 focus:ring-keralty-green">
                            <span className="w-11 h-11 rounded-lg bg-green-50 text-keralty-green flex items-center justify-center mb-4"><IconCalendar size={22} /></span>
                            <h3 className="text-lg font-bold text-keralty-blue">Realizar Cambios Múltiples</h3>
                            <p className="mt-2 text-sm text-slate-500 leading-relaxed">Crea varios turnos en bloque para un mismo médico, combina distintas fechas, salas y jornadas, y agrega varios grupos con médicos diferentes antes de guardar y enviar.</p>
                        </button>
                    </div>
                </div>
            </section>
        );

        const MultipleChangesForm = ({ doctorsList, isLoadingDoctors, changes, onAdd, onRemove, onRemoveLot, onSubmit, onRestoreDraft, onDirtyChange, ownerEmail, ownerName, isSubmitting, motionEnabled, onBack, setToast, resetKey }) => {
            const createLot = () => ({ id: "lot-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), doctor: "" });
            const initialLotRef = useRef(null);
            if (!initialLotRef.current) initialLotRef.current = createLot();

            const [lots, setLots] = useState([initialLotRef.current]);
            const [activeLotId, setActiveLotId] = useState(initialLotRef.current.id);
            const [draft, setDraft] = useState({ date: "", type: "", room: "" });
            const [showCalendarWarning, setShowCalendarWarning] = useState(false);
            const [confirmation, setConfirmation] = useState(null);
            const [highlightDoctor, setHighlightDoctor] = useState(false);
            const [draftRevision, setDraftRevision] = useState(0);
            const [isLoadingDraft, setIsLoadingDraft] = useState(true);
            const [isSavingDraft, setIsSavingDraft] = useState(false);
            const [draftSavedPulse, setDraftSavedPulse] = useState(false);
            const [conflictMessage, setConflictMessage] = useState("");
            const [transferPulse, setTransferPulse] = useState(0);
            const [fieldErrors, setFieldErrors] = useState({});
            const [validationCycle, setValidationCycle] = useState(0);
            const formTopRef = useRef(null);
            const formPanelRef = useRef(null);
            const doctorSelectRef = useRef(null);
            const savedSnapshotRef = useRef("");
            const hydrationCompleteRef = useRef(false);
            const previousResetKeyRef = useRef(resetKey);
            const activeLot = lots.find(lot => lot.id === activeLotId) || lots[0];
            const activeChanges = changes.filter(change => change.lotId === activeLotId);
            const sameDoctorChanges = changes.filter(change => activeLot && change.person === activeLot.doctor);
            const isRoomNotRequired = isRoomNotRequiredForType(draft.type);
            const allowedDays = getAllowedDayTypes(draft.type);
            const draftDayType = getDayType(draft.date);
            const scheduleConflict = activeLot ? findScheduleConflict({
                person: activeLot.doctor,
                date: draft.date,
                type: draft.type
            }, sameDoctorChanges) : null;
            const draftRoomRestriction = !isRoomNotRequired && draft.date && draft.room
                ? getRoomRestriction(draft.room, draft.date, activeLot ? activeLot.doctor : "", doctorsList)
                : "";
            const hasDraftData = changes.length > 0 || lots.some(lot => lot.doctor) || Boolean(draft.date || draft.type || draft.room);
            const isDraftReady = Boolean(
                activeLot && activeLot.doctor &&
                draft.type &&
                draft.date &&
                (isRoomNotRequired || draft.room) &&
                allowedDays.includes(draftDayType) &&
                !draftRoomRestriction &&
                (isRoomNotRequired || isRoomAvailableOnDate(draft.room, draft.date)) &&
                !scheduleConflict
            );
            const hasInProgressChange = Boolean(draft.type || draft.date || draft.room);
            const groupsAreComplete = changes.length > 0 && lots.every(lot => (
                Boolean(lot.doctor) && changes.some(change => change.lotId === lot.id)
            ));
            const isMultipleComplete = groupsAreComplete && (!hasInProgressChange || isDraftReady);
            const currentSnapshot = JSON.stringify({ lots, activeLotId, draft, changes });
            const hasUnsavedData = hasDraftData && currentSnapshot !== savedSnapshotRef.current;
            const isDraftSaved = Boolean(savedSnapshotRef.current) && !hasUnsavedData && changes.length > 0;
            const getGroupSignature = (lot, sourceChanges) => JSON.stringify({
                doctor: lot.doctor,
                changes: sourceChanges
                    .filter(change => change.lotId === lot.id)
                    .map(change => ({ person: change.person, date: change.date, type: change.type, room: change.room }))
                    .sort((first, second) => (first.date + first.type + first.room).localeCompare(second.date + second.type + second.room))
            });
            const isGroupSaved = (lot) => {
                if (!savedSnapshotRef.current) return false;
                try {
                    const saved = JSON.parse(savedSnapshotRef.current);
                    const savedLot = (saved.lots || []).find(item => item.id === lot.id);
                    return Boolean(savedLot) && getGroupSignature(lot, changes) === getGroupSignature(savedLot, saved.changes || []);
                } catch (error) {
                    return false;
                }
            };
            const AnimatePresence = motionEnabled && window.Motion ? window.Motion.AnimatePresence : null;

            useEffect(() => {
                let isActive = true;
                hydrationCompleteRef.current = false;
                setIsLoadingDraft(true);

                const restoreDraft = async () => {
                    if (!ownerEmail) return;
                    try {
                        const result = await backendGet({ action: "getDraft", email: ownerEmail });
                        let restored = result.status === "success" ? result.data : null;

                        // Migra una única vez los borradores creados por la versión anterior.
                        if (!restored) {
                            const legacyKey = getMultipleDraftStorageKey({ email: ownerEmail });
                            const legacyValue = window.localStorage.getItem(legacyKey);
                            if (legacyValue) {
                                restored = JSON.parse(legacyValue);
                                const migrationResult = await backendPost({
                                    action: "saveDraft",
                                    email: ownerEmail,
                                    userName: ownerName || "",
                                    draft: restored
                                });
                                if (migrationResult.status === "success") window.localStorage.removeItem(legacyKey);
                            }
                        }

                        if (!isActive || !restored) return;
                        const today = getBogotaTodayString();
                        const originalChanges = Array.isArray(restored.changes) ? restored.changes : [];
                        const restoredChanges = originalChanges.filter(change => change.date && change.date >= today);
                        const removedPastChanges = originalChanges.length - restoredChanges.length;
                        let restoredLots = Array.isArray(restored.lots) && restored.lots.length > 0 ? restored.lots : [createLot()];
                        restoredLots = restoredLots.filter(lot => restoredChanges.some(change => change.lotId === lot.id));
                        if (restoredLots.length === 0) restoredLots = [createLot()];
                        const rawDraft = restored.draft && typeof restored.draft === "object" ? restored.draft : { date: "", type: "", room: "" };
                        const restoredDraft = rawDraft.date && rawDraft.date < today ? { date: "", type: rawDraft.type || "", room: "" } : rawDraft;
                        const restoredActiveLotId = restoredLots.some(lot => lot.id === restored.activeLotId) ? restored.activeLotId : restoredLots[0].id;
                        const normalized = { lots: restoredLots, activeLotId: restoredActiveLotId, draft: restoredDraft, changes: restoredChanges };

                        if (removedPastChanges > 0) {
                            if (restoredChanges.length === 0) {
                                await backendPost({ action: "deleteDraft", email: ownerEmail });
                                restored = null;
                            } else {
                                await backendPost({ action: "saveDraft", email: ownerEmail, userName: ownerName || "", draft: normalized });
                            }
                        }
                        if (!restored) {
                            savedSnapshotRef.current = "";
                            setToast({ message: "Se eliminaron del borrador los turnos cuya fecha ya pasó.", type: "warning" });
                            return;
                        }

                        savedSnapshotRef.current = JSON.stringify(normalized);
                        setLots(restoredLots);
                        setActiveLotId(restoredActiveLotId);
                        setDraft(restoredDraft);
                        onRestoreDraft(restoredChanges);
                        setToast({
                            message: removedPastChanges > 0 ? "Se restauró el borrador y se eliminaron las fechas pasadas." : "Tu borrador de cambios múltiples fue restaurado.",
                            type: removedPastChanges > 0 ? "warning" : "success"
                        });
                    } catch (error) {
                        if (isActive) setToast({ message: "No fue posible cargar el borrador guardado.", type: "warning" });
                    } finally {
                        if (isActive) {
                            hydrationCompleteRef.current = true;
                            setIsLoadingDraft(false);
                            setDraftRevision(current => current + 1);
                        }
                    }
                };

                restoreDraft();
                return () => { isActive = false; };
            }, [ownerEmail]);

            useEffect(() => {
                if (previousResetKeyRef.current === resetKey) return;
                previousResetKeyRef.current = resetKey;
                const nextLot = createLot();
                setLots([nextLot]);
                setActiveLotId(nextLot.id);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
                setConfirmation(null);
                savedSnapshotRef.current = "";
                onDirtyChange(false);
            }, [resetKey]);

            useEffect(() => {
                if (hydrationCompleteRef.current) onDirtyChange(hasUnsavedData);
            }, [hasUnsavedData, currentSnapshot, draftRevision]);

            useEffect(() => () => onDirtyChange(false), []);

            useEffect(() => {
                if (isRoomNotRequired && draft.room) setDraft(current => ({ ...current, room: "" }));
            }, [isRoomNotRequired, draft.room]);

            const updateDoctor = (name) => {
                const duplicateLot = name && lots.find(lot => lot.id !== activeLotId && lot.doctor === name);
                if (duplicateLot) {
                    setToast({
                        message: "Ya existe un grupo con este médico. Para agregar más cambios a este médico, toca su grupo en la lista de abajo y edítalo",
                        type: "warning"
                    });
                    return;
                }
                setLots(current => current.map(lot => lot.id === activeLotId ? { ...lot, doctor: name } : lot));
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
                setConflictMessage("");
                setFieldErrors({});
            };

            const selectLot = (lotId) => {
                setActiveLotId(lotId);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
                setConflictMessage("");
                setFieldErrors({});
            };

            const editLot = (lotId) => {
                selectLot(lotId);
                window.setTimeout(() => {
                    if (formPanelRef.current) formPanelRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 50);
            };

            const showMultipleErrors = () => {
                const errors = getMultipleFieldErrors(activeLot, draft);
                setFieldErrors(errors);
                setValidationCycle(current => current + 1);
                if (Object.keys(errors).length > 0) {
                    setShowCalendarWarning(Boolean(errors.type));
                    setToast({ message: "Completa todos los campos obligatorios.", type: "error" });
                    scrollToFirstValidationError(formPanelRef.current);
                    return false;
                }
                return true;
            };

            const addChange = () => {
                if (!showMultipleErrors()) return;
                if (!allowedDays.includes(draftDayType)) {
                    setToast({ message: "La jornada seleccionada no está disponible para esta fecha.", type: "error" });
                    return;
                }
                const roomRestriction = !isRoomNotRequired ? getRoomRestriction(draft.room, draft.date, activeLot.doctor, doctorsList) : "";
                if (roomRestriction || (!isRoomNotRequired && !isRoomAvailableOnDate(draft.room, draft.date))) {
                    setToast({ message: roomRestriction || "La sala no está disponible para la fecha seleccionada.", type: "error" });
                    return;
                }
                if (scheduleConflict) {
                    const message = "Error: Existe conflicto de cruce de horarios. Ya has agregado el turno de " + formatShiftLabel(scheduleConflict.type) + " para esta fecha.";
                    setConflictMessage(message);
                    setToast({ message, type: "error" });
                    return;
                }

                onAdd({
                    id: Date.now().toString() + "-" + Math.random().toString(36).slice(2, 6),
                    lotId: activeLot.id,
                    person: activeLot.doctor,
                    date: draft.date,
                    type: draft.type,
                    room: isRoomNotRequired ? "N/A" : draft.room
                });
                setDraft(current => ({ date: "", type: current.type, room: "" }));
                setShowCalendarWarning(false);
                setConflictMessage("");
                setFieldErrors({});
                setTransferPulse(current => current + 1);
            };

            const addNewLot = () => {
                if (!activeLot || !activeLot.doctor || activeChanges.length === 0) {
                    setToast({ message: "Agrega al menos un cambio al grupo actual antes de crear otro.", type: "warning" });
                    return;
                }
                const nextLot = createLot();
                setLots(current => [nextLot, ...current]);
                setActiveLotId(nextLot.id);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
                setConflictMessage("");

                if (window.matchMedia && window.matchMedia("(max-width: 767px)").matches) {
                    setHighlightDoctor(true);
                    window.setTimeout(() => {
                        if (formPanelRef.current) formPanelRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
                        window.setTimeout(() => {
                            if (doctorSelectRef.current) doctorSelectRef.current.focus({ preventScroll: true });
                        }, 350);
                    }, 50);
                    window.setTimeout(() => setHighlightDoctor(false), 2200);
                }
            };

            const validateMultipleCollection = () => {
                const incompleteLot = lots.find(lot => !lot.doctor || !changes.some(change => change.lotId === lot.id));
                if (incompleteLot) {
                    setActiveLotId(incompleteLot.id);
                    const incompleteDraft = incompleteLot.id === activeLotId ? draft : { date: "", type: "", room: "" };
                    const nextErrors = getMultipleFieldErrors(incompleteLot, incompleteDraft);
                    if (incompleteLot.doctor && Object.keys(nextErrors).length === 0) {
                        nextErrors.collection = "Debes agregar este cambio al grupo antes de guardar o enviar";
                    }
                    setFieldErrors(nextErrors);
                    setValidationCycle(current => current + 1);
                    setToast({ message: "Cada grupo debe tener un médico y al menos un cambio completo.", type: "error" });
                    scrollToFirstValidationError(formPanelRef.current);
                    return false;
                }
                if (hasInProgressChange && !showMultipleErrors()) return false;
                setFieldErrors({});
                return true;
            };

            const saveDraft = async () => {
                if (!ownerEmail || isSavingDraft) return false;
                if (!validateMultipleCollection()) return false;
                const payload = { lots, activeLotId, draft, changes };
                const serialized = JSON.stringify(payload);
                setIsSavingDraft(true);
                setDraftSavedPulse(false);
                try {
                    const result = await backendPost({
                        action: "saveDraft",
                        email: ownerEmail,
                        userName: ownerName || "",
                        draft: payload
                    });
                    if (result.status !== "success") throw new Error(result.message || "No se pudo guardar");
                    savedSnapshotRef.current = serialized;
                    setDraftRevision(current => current + 1);
                    onDirtyChange(false);
                    setDraftSavedPulse(true);
                    window.setTimeout(() => setDraftSavedPulse(false), 1200);
                    setToast({ message: "Se guardó sin enviar correctamente", type: "success" });
                    return true;
                } catch (error) {
                    setToast({ message: "No se pudo guardar el borrador. Inténtalo nuevamente.", type: "error" });
                    return false;
                } finally {
                    setIsSavingDraft(false);
                }
            };

            const saveDraftAndLeave = async () => {
                const saved = await saveDraft();
                if (saved) resetAndLeave();
            };

            const submitAll = () => {
                if (!validateMultipleCollection()) return;
                const completedGroups = lots.filter(lot => changes.some(change => change.lotId === lot.id)).length;
                setConfirmation({ type: "send", groups: completedGroups, changes: changes.length });
            };

            const removeLot = (lotId) => {
                onRemoveLot(lotId);
                if (lots.length === 1) {
                    const nextLot = createLot();
                    setLots([nextLot]);
                    setActiveLotId(nextLot.id);
                    setDraft({ date: "", type: "", room: "" });
                    setShowCalendarWarning(false);
                    setConflictMessage("");
                    return;
                }
                const remainingLots = lots.filter(lot => lot.id !== lotId);
                setLots(remainingLots);
                if (activeLotId === lotId) {
                    setActiveLotId(remainingLots[0].id);
                    setDraft({ date: "", type: "", room: "" });
                    setShowCalendarWarning(false);
                    setConflictMessage("");
                }
            };

            const resetAndLeave = () => {
                const nextLot = createLot();
                setLots([nextLot]);
                setActiveLotId(nextLot.id);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
                setConflictMessage("");
                setConfirmation(null);
                onBack();
            };

            const requestBack = () => {
                if (hasUnsavedData) {
                    setConfirmation({ type: "back" });
                    return;
                }
                resetAndLeave();
            };

            const confirmPendingAction = () => {
                if (!confirmation) return;
                if (confirmation.type === "delete") {
                    removeLot(confirmation.lotId);
                    setConfirmation(null);
                    return;
                }
                if (confirmation.type === "send") {
                    setConfirmation(null);
                    onSubmit();
                    return;
                }
                resetAndLeave();
            };

            if (isLoadingDraft) {
                return (
                    <section ref={formTopRef} className="multiple-changes-view bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-keralty-blue px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center"><span className="text-keralty-green mr-2"><IconCalendar /></span><h2 className="text-lg font-semibold text-white">Cambios Múltiples</h2></div>
                            <button type="button" onClick={onBack} className="text-sm text-white/90 hover:text-white font-medium">Volver</button>
                        </div>
                        <div className="p-10 text-center text-slate-600">
                            <div className="loading-dots mb-3"><span></span><span></span><span></span></div>
                            <p className="text-sm">Cargando tu borrador...</p>
                        </div>
                    </section>
                );
            }

            return (
                <section ref={formTopRef} className="multiple-changes-view">
                    <div className="bg-keralty-blue px-6 py-4 flex items-center justify-between rounded-lg shadow-sm">
                        <div className="flex items-center"><span className="text-keralty-green mr-2"><IconCalendar /></span><h2 className="text-lg font-semibold text-white">Cambios Múltiples</h2></div>
                        <button type="button" onClick={requestBack} className="text-sm text-white/90 hover:text-white font-medium">Volver</button>
                    </div>

                    <div className="mt-5 space-y-5">
                        <div ref={formPanelRef} className="multiple-panel p-5 relative scroll-mt-24">
                            <div className="multiple-panel-title mb-5">
                                <span className="w-8 h-8 rounded-lg bg-green-50 text-keralty-green flex items-center justify-center"><IconPlus size={17} /></span>
                                <h3>Configurar cambio</h3>
                            </div>

                            <div className="space-y-6">
                                <div key={"multiple-person-" + validationCycle} data-validation-error={fieldErrors.person ? "true" : undefined} className={`max-w-xl rounded-lg ${fieldErrors.person ? "field-error-shake" : ""}`}>
                                    <label className="text-sm font-medium text-slate-700 block mb-2">1. Médico asignado para este grupo</label>
                                    <div className="relative">
                                        <select ref={doctorSelectRef} value={activeLot ? activeLot.doctor : ""} onChange={(event) => updateDoctor(event.target.value)} disabled={activeChanges.length > 0} className={`w-full pl-3 pr-10 py-2.5 bg-white border rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-500 transition-shadow ${highlightDoctor ? "border-blue-400 ring-4 ring-blue-200" : "border-slate-200"} ${fieldErrors.person ? "field-error" : ""}`}>
                                            <option value="">{isLoadingDoctors ? "Cargando médicos..." : "Selecciona un médico..."}</option>
                                            <DoctorOptions doctorsList={doctorsList} />
                                        </select>
                                        <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                                    </div>
                                    {fieldErrors.person && <p className="mt-2 text-xs font-semibold text-red-600">{fieldErrors.person}</p>}
                                    {activeChanges.length > 0 && <p className="mt-2 text-xs text-slate-500">El médico queda fijado mientras existan cambios en este grupo.</p>}
                                </div>

                                <div key={"multiple-type-" + validationCycle} data-validation-error={fieldErrors.type ? "true" : undefined} className={`max-w-xl border-t border-slate-200 pt-5 ${fieldErrors.type ? "field-error-shake" : ""}`}>
                                    <label className="text-sm font-medium text-slate-700 block mb-2">2. Tipo de Jornada</label>
                                    <div className="relative">
                                        <select value={draft.type} onChange={(event) => {
                                            setDraft({ date: "", type: event.target.value, room: "" });
                                            setShowCalendarWarning(false);
                                            setConflictMessage("");
                                            setFieldErrors(current => ({ ...current, type: undefined, date: undefined, room: undefined, collection: undefined }));
                                        }} disabled={!activeLot || !activeLot.doctor} className={`w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-400 ${fieldErrors.type ? "field-error" : ""}`}>
                                            <option value="">{activeLot && activeLot.doctor ? "Selecciona jornada..." : "Selecciona primero el médico"}</option>
                                            {Object.entries(SHIFT_TYPES).map(([category, types]) => <optgroup key={category} label={category}>{types.map(type => <option key={type} value={category + " - " + type}>{type}</option>)}</optgroup>)}
                                        </select>
                                        <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                                    </div>
                                    {fieldErrors.type && <p className="mt-2 text-xs font-semibold text-red-600">{fieldErrors.type}</p>}
                                </div>

                                <div className="border-t border-slate-200 pt-5">
                                    <p className="text-sm font-medium text-slate-700 mb-4">3. Fecha y sala para este cambio</p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
                                        <div key={"multiple-date-" + validationCycle} data-validation-error={fieldErrors.date ? "true" : undefined} className={`space-y-2 rounded-lg ${fieldErrors.date ? "field-error-shake" : ""}`}>
                                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconCalendar /></span> Fecha</label>
                                            <div className={fieldErrors.date ? "rounded-lg field-error" : ""}>
                                                {draft.type ? (
                                                    <CustomCalendar value={draft.date} onChange={(date) => {
                                                        setDraft(current => ({ ...current, date, room: "" }));
                                                        setConflictMessage("");
                                                        setFieldErrors(current => ({ ...current, date: undefined, room: undefined, collection: undefined }));
                                                    }} allowedTypes={allowedDays} />
                                                ) : (
                                                    <button type="button" onClick={() => setShowCalendarWarning(true)} className="button-press w-full px-3 py-2.5 bg-slate-100 border border-slate-200 rounded-lg flex justify-between items-center text-left text-slate-400">
                                                        <span>Seleccionar fecha...</span>
                                                        <IconCalendar size={18} />
                                                    </button>
                                                )}
                                            </div>
                                            {fieldErrors.date && <p className="text-xs font-semibold text-red-600">{fieldErrors.date}</p>}
                                            {showCalendarWarning && !draft.type && !fieldErrors.type && <p className="text-sm font-semibold text-red-600">Selecciona primero el tipo de jornada</p>}
                                        </div>

                                        <div key={"multiple-room-" + validationCycle} data-validation-error={fieldErrors.room ? "true" : undefined} className={`space-y-2 rounded-lg ${fieldErrors.room ? "field-error-shake" : ""}`}>
                                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconLayout /></span> Sala</label>
                                            <div className="relative">
                                                <select value={draft.room} onChange={(event) => {
                                                    setDraft(current => ({ ...current, room: event.target.value }));
                                                    setConflictMessage("");
                                                    setFieldErrors(current => ({ ...current, room: undefined, collection: undefined }));
                                                }} disabled={isRoomNotRequired || !draft.date} className={`w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-400 ${fieldErrors.room ? "field-error" : ""}`}>
                                                    <option value="">{isRoomNotRequired ? "No aplica" : (draft.date ? "Selecciona sala..." : "Selecciona primero la fecha")}</option>
                                                    {Object.entries(ROOMS_GROUPED).map(([groupName, rooms]) => (
                                                        <optgroup key={groupName} label={groupName}>
                                                            {rooms.map(room => {
                                                                const reason = getRoomRestriction(room, draft.date, activeLot ? activeLot.doctor : "", doctorsList);
                                                                return <option key={room} value={room} disabled={Boolean(reason)}>{room}{reason ? " (" + reason + ")" : ""}</option>;
                                                            })}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                                            </div>
                                            {fieldErrors.room && <p className="text-xs font-semibold text-red-600">{fieldErrors.room}</p>}
                                        </div>
                                    </div>

                                    <div data-validation-error={fieldErrors.collection ? "true" : undefined} className={`mt-5 flex flex-col items-end gap-2 rounded-lg ${fieldErrors.collection ? "field-error-shake" : ""}`}>
                                        <button type="button" onClick={addChange} className={`button-press inline-flex items-center justify-center px-4 py-2.5 rounded-lg font-medium text-keralty-blue border transition-colors ${isDraftReady ? "bg-blue-100 border-blue-300 hover:bg-blue-200" : "bg-white border-keralty-blue hover:bg-blue-50"}`}>
                                            <span className="mr-2"><IconPlus size={18} /></span> Agregar Cambio al grupo de {formatDoctorFirstName(activeLot ? activeLot.doctor : "")}
                                        </button>
                                        {fieldErrors.collection && <p className="text-sm font-bold text-red-600 text-right">{fieldErrors.collection}</p>}
                                        {conflictMessage && <p role="alert" className="text-sm font-bold text-red-600 text-right">{conflictMessage}</p>}
                                    </div>
                                </div>
                            </div>

                            {transferPulse > 0 && (
                                <span key={transferPulse} className="transfer-indicator" aria-hidden="true"><IconChevronDown size={20} /></span>
                            )}
                        </div>

                        <div className="multiple-panel p-5">
                            <div className="mb-5">
                                <div className="multiple-panel-title">
                                    <span className="w-8 h-8 rounded-lg bg-blue-50 text-keralty-blue flex items-center justify-center"><IconFileText size={17} /></span>
                                    <h3>Verifica tu Borrador de cambios</h3>
                                </div>
                                <p className={`mt-3 text-sm font-semibold ${isDraftSaved ? "text-emerald-600" : "text-red-600"}`}>
                                    {isDraftSaved ? "Borrador guardado" : "Borrador sin guardar"}
                                </p>
                                <p className="mt-1 text-xs text-slate-500">Toca un grupo para editarlo</p>
                                <p className="mt-2 text-sm text-slate-500">{lots.filter(lot => changes.some(change => change.lotId === lot.id)).length} grupo(s) · {changes.length} cambio(s)</p>
                            </div>

                            {changes.length === 0 ? (
                                <div className="border border-dashed border-slate-300 rounded-lg p-5 text-sm text-slate-500 text-center bg-slate-50">Agrega los cambios que deseas enviar para el médico seleccionado.</div>
                            ) : (
                                <div className="space-y-4">
                                    {lots.map((lot, lotIndex) => {
                                        const lotChanges = changes.filter(change => change.lotId === lot.id).sort((first, second) => first.date.localeCompare(second.date));
                                        if (lotChanges.length === 0) return null;
                                        return (
                                            <div key={lot.id} className={`bg-white border rounded-lg overflow-hidden ${lot.id === activeLotId ? "border-keralty-blue shadow-sm" : "border-slate-200"}`}>
                                                <div role="button" tabIndex="0" onClick={() => editLot(lot.id)} onKeyDown={(event) => {
                                                    if (event.key === "Enter" || event.key === " ") {
                                                        event.preventDefault();
                                                        editLot(lot.id);
                                                    }
                                                }} className="px-4 py-3 bg-keralty-blue border-b border-blue-900 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 cursor-pointer">
                                                    <div>
                                                        <p className="text-xs font-bold uppercase text-white/70">Grupo {lotIndex + 1}</p>
                                                        <p className="text-sm font-semibold text-white">{formatDoctorFullName(lot.doctor)}</p>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <button type="button" onClick={(event) => { event.stopPropagation(); editLot(lot.id); }} className="button-press inline-flex items-center justify-center px-3 py-2 rounded-lg bg-white text-keralty-blue text-xs font-semibold shadow-sm hover:bg-blue-50">
                                                            <IconFileText size={15} className="mr-1.5" /> Editar grupo
                                                        </button>
                                                        <button type="button" onClick={(event) => { event.stopPropagation(); setConfirmation({ type: "delete", lotId: lot.id }); }} className="button-press inline-flex items-center justify-center px-3 py-2 rounded-lg bg-red-50 text-red-600 text-xs font-semibold shadow-sm hover:bg-red-100">
                                                            <IconTrash size={15} className="mr-1.5" /> Eliminar
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="divide-y divide-slate-100">
                                                    {AnimatePresence ? <AnimatePresence initial={false}>{lotChanges.map(change => (
                                                        <MotionView key={change.id} enabled={motionEnabled} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, x: -8 }} transition={{ duration: 0.2 }} className="px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                            <p className="text-sm text-slate-700"><strong>{change.date}</strong><span className="text-slate-400 mx-2">-</span>{change.room}<span className="text-slate-400 mx-2">-</span>{formatShiftLabel(change.type)}</p>
                                                            <button type="button" onClick={() => onRemove(change.id)} className="button-press text-sm text-red-600 hover:text-red-700 font-medium inline-flex items-center"><IconTrash size={16} className="mr-1" /> Eliminar cambio</button>
                                                        </MotionView>
                                                    ))}</AnimatePresence> : lotChanges.map(change => (
                                                        <div key={change.id} className="px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                            <p className="text-sm text-slate-700"><strong>{change.date}</strong><span className="text-slate-400 mx-2">-</span>{change.room}<span className="text-slate-400 mx-2">-</span>{formatShiftLabel(change.type)}</p>
                                                            <button type="button" onClick={() => onRemove(change.id)} className="button-press text-sm text-red-600 hover:text-red-700 font-medium inline-flex items-center"><IconTrash size={16} className="mr-1" /> Eliminar cambio</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            <div className="mt-5 pt-5 border-t border-slate-200 w-full sm:max-w-lg">
                                <button type="button" onClick={addNewLot} className="button-press w-full inline-flex items-center justify-center px-4 py-2.5 rounded-lg font-medium text-keralty-blue bg-white border border-keralty-blue hover:bg-blue-50">
                                    <span className="mr-2"><IconPlus size={18} /></span> Agregar nuevo grupo
                                </button>
                                <button type="button" onClick={saveDraft} disabled={isSavingDraft} aria-disabled={!isMultipleComplete} className={`draft-save-button button-press mt-3 w-full inline-flex items-center justify-center px-5 py-2.5 rounded-lg font-medium border ${isMultipleComplete ? "bg-white text-keralty-blue border-keralty-blue hover:bg-blue-50" : "save-incomplete border-slate-400"} ${draftSavedPulse ? "draft-save-button-success" : ""}`}>
                                    {isSavingDraft ? <IconRefresh className="animate-spin mr-2" size={18} /> : <span className="mr-2"><IconSave size={18} /></span>} {isSavingDraft ? "Guardando..." : "Guardar borrador sin enviar"}
                                </button>
                                <p className="mt-2 text-xs leading-relaxed text-slate-500">Guarda los cambios y grupos sin enviarlos todavía, por si necesitas añadir más cambios que aún están a la espera de confirmación</p>
                            </div>
                        </div>

                        <div className="multiple-panel p-5">
                            <div className="w-full sm:max-w-lg ml-auto">
                                <button type="button" onClick={submitAll} disabled={isSubmitting} aria-disabled={!isMultipleComplete} className={`button-press w-full inline-flex items-center justify-center px-6 py-3 rounded-lg font-medium ${isMultipleComplete ? "save-ready" : "save-incomplete"}`}>
                                    {isSubmitting ? <IconRefresh className="animate-spin mr-2" /> : <span className="mr-2"><IconSave /></span>} Guardar y enviar todos
                                </button>
                            </div>
                        </div>
                    </div>

                    {confirmation && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center animate-fade-in">
                                <div className={`w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 ${confirmation.type === "send" ? "bg-green-100 text-green-600" : "bg-red-100 text-red-500"}`}>
                                    {confirmation.type === "send" ? <IconSave size={28} /> : <IconAlert size={28} />}
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">
                                    {confirmation.type === "delete"
                                        ? "¿Eliminar este grupo?"
                                        : (confirmation.type === "send" ? "Confirma el envío" : "¿Salir sin guardar?")}
                                </h3>
                                {confirmation.type === "send" ? (
                                    <div className="mb-6">
                                        <p className="text-sm text-slate-500">Se procesarán:</p>
                                        <p className="mt-3 text-lg font-bold text-keralty-blue">{confirmation.groups} grupo(s) · {confirmation.changes} cambio(s)</p>
                                    </div>
                                ) : (
                                    <p className="text-sm text-slate-500 mb-6">
                                        {confirmation.type === "delete"
                                            ? "¿Estás seguro de que deseas eliminar este grupo? Los cambios incluidos se quitarán de la lista."
                                            : "Los cambios no se han guardado. Si continúas, se perderán las selecciones y los grupos actuales."}
                                    </p>
                                )}
                                {confirmation.type === "send" ? (
                                    <div className="flex flex-col-reverse sm:flex-row gap-3">
                                        <button type="button" onClick={() => setConfirmation(null)} className="button-press flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Seguir editando</button>
                                        <button type="button" onClick={confirmPendingAction} className="button-press flex-1 py-2.5 bg-keralty-green text-white rounded-lg font-medium hover:opacity-90">Confirmar y enviar</button>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-3">
                                        {confirmation.type === "back" && (
                                            <button type="button" onClick={saveDraftAndLeave} disabled={isSavingDraft} className="button-press w-full py-2.5 px-3 bg-keralty-green text-white rounded-lg font-medium hover:opacity-90 disabled:opacity-60">
                                                {isSavingDraft ? "Guardando..." : "Guardar borradores sin enviar todavía y luego salir"}
                                            </button>
                                        )}
                                        <div className="flex gap-3">
                                            <button type="button" onClick={() => setConfirmation(null)} className="button-press flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Quedarse aquí</button>
                                            <button type="button" onClick={confirmPendingAction} className="button-press flex-1 py-2.5 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600">
                                                {confirmation.type === "delete" ? "Sí, eliminar" : "Salir sin guardar"}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </section>
            );
        };

        const HistorySection = ({ history, isLoading, show, onToggle, selectedIds, onSelectIds, onRequestDelete, motionEnabled }) => {
            const [expandedDates, setExpandedDates] = useState({});
            const AnimatePresence = motionEnabled && window.Motion ? window.Motion.AnimatePresence : null;

            useEffect(() => {
                if (!show) setExpandedDates({});
            }, [show]);

            const dateGroups = history.reduce((groups, entry) => {
                const key = entry.fechaRegistro || "Sin fecha";
                if (!groups[key]) groups[key] = [];
                groups[key].push(entry);
                return groups;
            }, {});
            const orderedDates = Object.keys(dateGroups);
            const allSelected = history.length > 0 && history.every(entry => selectedIds.includes(entry.rowId));
            const setChecked = (event, ids) => {
                event.stopPropagation();
                onSelectIds(ids, event.target.checked);
            };

            const renderEntry = (entry) => (
