        const generateColombianHolidays = (startYear, yearsAhead) => {
            let holidays = [];
            for (let year = startYear; year <= startYear + yearsAhead; year++) {
                const add = (m, d) => holidays.push(`${year}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
                add(1, 1); add(5, 1); add(7, 20); add(8, 7); add(12, 8); add(12, 25);
                const addEmiliani = (m, d) => {
                    let date = new Date(year, m - 1, d);
                    let day = date.getDay();
                    if (day !== 1) date.setDate(date.getDate() + (day === 0 ? 1 : 8 - day));
                    holidays.push(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`);

                addEmiliani(1, 6); addEmiliani(3, 19); addEmiliani(6, 29); addEmiliani(8, 15); addEmiliani(10, 12); addEmiliani(11, 1); addEmiliani(11, 11);

                let a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
                let f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
                let i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
                let m = Math.floor((a + 11 * h + 22 * l) / 451), month = Math.floor((h + l - 7 * m + 114) / 31) - 1, day = ((h + l - 7 * m + 114) % 31) + 1;

                holidays.push(formatDate(addDays(easter, -3))); holidays.push(formatDate(addDays(easter, -2)));
                holidays.push(moveToMonday(addDays(easter, 39))); holidays.push(moveToMonday(addDays(easter, 60))); holidays.push(moveToMonday(addDays(easter, 68)));
            }
            return holidays;

                    <div onClick={() => setIsOpen(true)} className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer flex justify-between items-center text-slate-700 hover:bg-slate-100 transition-colors">
                        <span>{value ? value : "Seleccionar fecha..."}</span>
                        <IconCalendar size={18} />
                    </div>
                    {isOpen && (
                        <div className="absolute z-50 mt-1 bg-white border border-slate-200 shadow-2xl rounded-xl p-4 w-72 sm:w-80 left-0">
                            <div className="fixed inset-0 z-40" onClick={(e) => { e.stopPropagation(); setIsOpen(false); setShowYearPicker(false); }}></div>
                            <div className="relative z-50">
                                <div className="flex justify-between items-center mb-4">
                                    <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&lt;</button>
                                    <span onClick={(e) => { e.stopPropagation(); setShowYearPicker(!showYearPicker); }} className="font-bold text-slate-700 capitalize cursor-pointer hover:text-keralty-blue px-2 py-1 rounded hover:bg-slate-50 transition-colors">
                                        {showYearPicker ? `${yearPage - 5} - ${yearPage + 6}` : `${MONTH_NAMES[viewMonth]} ${viewYear}`}
                                    </span>
                                    <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&gt;</button>
                                </div>
                                {showYearPicker ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        {Array.from({ length: 12 }, (_, i) => yearPage - 5 + i).map(y => (
                                            <div key={y} onClick={(e) => { e.stopPropagation(); setViewDate(new Date(y, viewMonth, 1)); setShowYearPicker(false); }} className={`h-10 flex items-center justify-center rounded text-sm font-medium cursor-pointer transition-colors ${y === viewYear ? 'bg-keralty-blue text-white shadow-sm' : 'bg-slate-50 text-slate-700 hover:bg-slate-200'}`}>{y}</div>
                                        ))}
                                    </div>
                                ) : (
                                    <>
                                        <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-slate-400"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {days.map((day, idx) => {
                                                if (!day) return <div key={idx}></div>;
                                                const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                                const dayType = getDayType(dateStr);
                                                const isPast = dateStr < todayString;
                                                const isAllowed = allowedTypes.includes(dayType) && !isPast && (!isDateAllowed || isDateAllowed(dateStr));
                                                
                                                let colorClasses = !isAllowed ? "bg-slate-50 text-slate-300 cursor-not-allowed opacity-40" : 
                                                    (dayType === 'festivo' ? "bg-purple-100 text-purple-800 hover:bg-purple-200 border-purple-200 border" : 
                                                    (dayType === 'domingo' ? "bg-red-100 text-red-800 hover:bg-red-200 border-red-200 border" : 
                                                    (dayType === 'sabado' ? "bg-blue-100 text-blue-800 hover:bg-blue-200 border-blue-200 border" : "bg-white text-slate-700 hover:bg-slate-100 border-slate-200 border")));

                                                if (value === dateStr) colorClasses += " ring-2 ring-keralty-blue ring-offset-1";

                                                return <div key={idx} onClick={(e) => { e.stopPropagation(); if (isAllowed) { onChange(dateStr); setIsOpen(false); } }} className={`h-8 sm:h-9 flex items-center justify-center rounded text-sm font-medium cursor-pointer transition-colors ${colorClasses}`}>{day}</div>;
                                            })}
                                        </div>
                                        <div className="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-[10px] sm:text-xs text-slate-500 font-medium">
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-white border border-slate-300 mr-1.5"></span> Hábil</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-blue-300 mr-1.5"></span> Sábado</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-red-300 mr-1.5"></span> Domingo</div>
                                            <div className="flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-purple-300 mr-1.5"></span> Festivo</div>
                                        </div>
                                        {allowedTypes.length < 4 && (<div className="mt-3 text-[10.5px] text-amber-700 bg-amber-50 p-2 rounded-lg flex items-start leading-tight border border-amber-100"><IconAlert size={14} className="mr-1.5 shrink-0 mt-0.5" /> El tipo de jornada seleccionada aplicó filtros de días a este calendario.</div>)}
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        const MultiDateCalendar = ({ selectedDates, onChange, allowedTypes, isDateAllowed }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [showYearPicker, setShowYearPicker] = useState(false);
            const [yearPage, setYearPage] = useState(viewDate.getFullYear());

            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const startOffset = (firstDay + 6) % 7;
            const today = new Date();
            const todayString = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0') + "-" + String(today.getDate()).padStart(2, '0');
            const days = Array(startOffset).fill(null);
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            for (let day = 1; day <= daysInMonth; day++) days.push(day);

            useEffect(() => {
                if (!showYearPicker) setYearPage(viewDate.getFullYear());
            }, [viewDate, showYearPicker]);

            const toggleDate = (dateString) => {
                const nextDates = selectedDates.includes(dateString)
                    ? selectedDates.filter(date => date !== dateString)
                    : [...selectedDates, dateString].sort();
                onChange(nextDates);
            };

            const handlePrev = () => {
                if (showYearPicker) setYearPage(current => current - 12);
                else setViewDate(new Date(viewYear, viewMonth - 1, 1));
            };

            const handleNext = () => {
                if (showYearPicker) setYearPage(current => current + 12);
                else setViewDate(new Date(viewYear, viewMonth + 1, 1));
            };

            return (
                <div className="relative">
                    <button type="button" onClick={() => setIsOpen(true)} className="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg flex justify-between items-center text-left text-slate-700 hover:bg-slate-50 transition-colors">
                        <span>{selectedDates.length ? selectedDates.length + " fecha(s) adicional(es) seleccionada(s)" : "Seleccionar fechas adicionales..."}</span>
                        <IconCalendar size={18} />
                    </button>
                    {isOpen && (
                        <div className="absolute z-50 mt-1 bg-white border border-slate-200 shadow-2xl rounded-xl p-4 w-72 sm:w-80 left-0">
                            <div className="fixed inset-0 z-40" onClick={() => { setIsOpen(false); setShowYearPicker(false); }}></div>
                            <div className="relative z-50">
                                <div className="flex justify-between items-center mb-3">
                                    <button type="button" onClick={handlePrev} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&lt;</button>
                                    <button type="button" onClick={() => setShowYearPicker(!showYearPicker)} className="font-bold text-slate-700 capitalize hover:text-keralty-blue px-2 py-1 rounded hover:bg-slate-50 transition-colors">
                                        {showYearPicker ? (yearPage - 5) + " - " + (yearPage + 6) : monthNames[viewMonth] + " " + viewYear}
                                    </button>
                                    <button type="button" onClick={handleNext} className="p-1.5 hover:bg-slate-100 text-slate-500 rounded-lg font-bold">&gt;</button>
                                </div>
                                {showYearPicker ? (
                                    <div className="grid grid-cols-3 gap-2">
                                        {Array.from({ length: 12 }, (_, index) => yearPage - 5 + index).map(year => (
                                            <button type="button" key={year} onClick={() => { setViewDate(new Date(year, viewMonth, 1)); setShowYearPicker(false); }} className={`h-10 rounded text-sm font-medium transition-colors ${year === viewYear ? 'bg-keralty-blue text-white shadow-sm' : 'bg-slate-50 text-slate-700 hover:bg-slate-200'}`}>{year}</button>
                                        ))}
                                    </div>
                                ) : (
                                    <>
                                        <p className="text-xs text-slate-500 mb-3 leading-relaxed">Selecciona todos los días en los que se repetirá exactamente este cambio. Puedes navegar entre meses.</p>
                                        <div className="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-bold text-slate-400"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {days.map((day, index) => {
                                                if (!day) return <div key={index}></div>;
                                                const dateString = viewYear + "-" + String(viewMonth + 1).padStart(2, '0') + "-" + String(day).padStart(2, '0');
                                                const canSelect = allowedTypes.includes(getDayType(dateString)) && dateString >= todayString && (!isDateAllowed || isDateAllowed(dateString));
                                                const isSelected = selectedDates.includes(dateString);
                                                const classes = !canSelect
                                                    ? "bg-slate-50 text-slate-300 cursor-not-allowed opacity-40"
                                                    : (isSelected ? "bg-keralty-green text-white ring-2 ring-keralty-green ring-offset-1" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200");

                                                return <button type="button" key={index} disabled={!canSelect} onClick={() => toggleDate(dateString)} className={`h-8 sm:h-9 flex items-center justify-center rounded text-sm font-medium transition-colors ${classes}`}>{day}</button>;
                                            })}
                                        </div>
                                        {selectedDates.length > 0 && (
                                            <button type="button" onClick={() => onChange([])} className="mt-3 text-xs font-medium text-red-600 hover:text-red-700">Limpiar fechas adicionales</button>
                                        )}
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    {selectedDates.length > 0 && (
                        <p className="mt-2 text-xs text-slate-500 leading-relaxed">{selectedDates.join(", ")}</p>
                    )}
                </div>
            );
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            const bgColor = type === 'error' ? 'bg-red-500' : (type === 'warning' ? 'bg-amber-500' : 'bg-keralty-green');
            const Icon = type === 'error' || type === 'warning' ? IconAlert : IconCheck;
            return <div className={`fixed bottom-4 right-4 ${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 animate-bounce-short z-50`}><Icon /><span className="font-medium">{message}</span></div>;
        };

        const ShiftEntry = ({ shift, index, updateShift, removeShift, doctorsList, isLoadingDoctors }) => {
            const isRoomNotRequired = shift.type.includes("Nocturnos") || shift.type.includes("Disponibilidad") || shift.type.includes("Extendido");
            const currentDayType = getDayType(shift.date);
            const isSaturday = currentDayType === 'sabado';

            const getAllowedDayTypes = (shiftType) => {
                if (!shiftType) return ['habil', 'sabado', 'domingo', 'festivo'];
                if (shiftType.includes("Extendido Sabado")) return ['sabado'];
                if (shiftType.includes("Extendido 1") || shiftType.includes("Extendido 2") || shiftType.includes("Extendido 3")) return ['habil'];
                if (shiftType.includes("Disponibilidad U2")) return ['domingo', 'festivo'];
                if (shiftType.includes("Disponibilidad AM") || shiftType.includes("Disponibilidad PM")) return ['habil'];
                if (shiftType.includes("Fin de semana")) return ['sabado', 'domingo', 'festivo'];
                if (shiftType.includes("Entre semana")) return ['habil'];
                return ['habil', 'sabado', 'domingo', 'festivo'];
            };
            const allowedDays = getAllowedDayTypes(shift.type);
            const additionalDates = shift.additionalDates || [];
            const additionalDatesKey = additionalDates.join('|');

            useEffect(() => {
                if (isRoomNotRequired && shift.room !== "") updateShift(shift.id, 'room', "");
                if (shift.date && !allowedDays.includes(currentDayType)) updateShift(shift.id, 'date', "");
                if (shift.room === "Sala 7" && !isSaturday) updateShift(shift.id, 'room', "");
                
                const isRestrictedRoomSelected = ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "U"].includes(shift.room);
                if (isRestrictedRoomSelected && currentDayType && currentDayType !== 'domingo' && currentDayType !== 'festivo') updateShift(shift.id, 'room', "");
                
                const isStandardRoomSelected = ["Sala CS", "Sala 2", "Sala 3", "Sala 4", "Sala 5", "Sala 6", "Sala 8", "Sala 9"].includes(shift.room);
                if (isStandardRoomSelected && currentDayType && (currentDayType === 'domingo' || currentDayType === 'festivo')) updateShift(shift.id, 'room', "");

                // Validar bloqueo retroactivo de salas de excelencia si el usuario cambia el médico
                const selectedDoc = doctorsList.find(d => d.name === shift.person) || {};
                const docGroup = (selectedDoc.group || "").toLowerCase();
                
                const isCaderasRoom = shift.room === "Sala Caderas";
                const isSugarbakerRoom = shift.room === "Sala Sugarbaker";
                const isMicrocirugiaRoom = shift.room === "Sala Microcirugía";
                
                if (isCaderasRoom && !docGroup.includes("caderas")) updateShift(shift.id, 'room', "");
                if (isSugarbakerRoom && !docGroup.includes("sugarbaker")) updateShift(shift.id, 'room', "");
                if (isMicrocirugiaRoom && !docGroup.includes("microcirug")) updateShift(shift.id, 'room', "");
            }, [shift.type, shift.date, shift.person, isRoomNotRequired, currentDayType]);

            useEffect(() => {
                const validAdditionalDates = additionalDates.filter(date => (
                    date !== shift.date &&
                    allowedDays.includes(getDayType(date)) &&
                    (isRoomNotRequired || !shift.room || isRoomAvailableOnDate(shift.room, date))
                ));

                if (validAdditionalDates.length !== additionalDates.length) {
                    updateShift(shift.id, 'additionalDates', validAdditionalDates);
                }
            }, [shift.date, shift.type, shift.room, isRoomNotRequired, additionalDatesKey]);

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-4 transition-all hover:shadow-md">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-50">
                        <h4 className="font-semibold text-keralty-blue flex items-center"><span className="text-keralty-green mr-2"><IconActivity /></span>Cambio de Turno #{index + 1}</h4>
                        {index > 0 && <button onClick={() => removeShift(shift.id)} className="text-red-400 hover:text-red-600 p-1 rounded-full hover:bg-red-50 transition-colors"><IconTrash /></button>}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="space-y-2">
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconUser /></span> Persona Asignada</label>
                            <div className="relative">
                                <select value={shift.person} onChange={(e) => updateShift(shift.id, 'person', e.target.value)} className="w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700">
                                    <option value="">{isLoadingDoctors ? "Cargando..." : "Seleccione..."}</option>
                                    {doctorsList.map((doc, i) => <option key={i} value={doc.name}>{doc.name}</option>)}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconClock /></span> Tipo de Jornada</label>
                            <div className="relative">
                                <select value={shift.type} onChange={(e) => updateShift(shift.id, 'type', e.target.value)} className="w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700">
                                    <option value="">Seleccione jornada...</option>
                                    {Object.entries(SHIFT_TYPES).map(([cat, types]) => <optgroup key={cat} label={cat}>{types.map(t => <option key={t} value={`${cat} - ${t}`}>{t}</option>)}</optgroup>)}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconCalendar /></span> Fecha del Turno</label>
                            <CustomCalendar value={shift.date} onChange={(date) => updateShift(shift.id, 'date', date)} allowedTypes={allowedDays} />
                        </div>
                        <div className="space-y-2">
                            <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconLayout /></span> Sala Asignada</label>
                            <div className="relative">
                                <select value={shift.room} onChange={(e) => updateShift(shift.id, 'room', e.target.value)} disabled={isRoomNotRequired} className={`w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 ${isRoomNotRequired ? 'opacity-50 cursor-not-allowed bg-slate-200' : ''}`}>
                                    <option value="">{isRoomNotRequired ? "No aplica" : "Seleccione sala..."}</option>
                                    {Object.entries(ROOMS_GROUPED).map(([groupName, rooms]) => (
                                        <optgroup key={groupName} label={groupName}>
                                            {rooms.map((room, i) => {
                                                const isSala7 = room === "Sala 7";
                                                const isSundayOrHoliday = currentDayType === 'domingo' || currentDayType === 'festivo';
                                                const isRestrictedRoom = ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "U"].includes(room);
                                                const isStandardRoom = ["Sala CS", "Sala 2", "Sala 3", "Sala 4", "Sala 5", "Sala 6", "Sala 8", "Sala 9"].includes(room);
                                                
                                                const selectedDoc = doctorsList.find(d => d.name === shift.person) || {};
                                                const docGroup = (selectedDoc.group || "").toLowerCase();
                                                
                                                const isCaderasRoom = room === "Sala Caderas";
                                                const isSugarbakerRoom = room === "Sala Sugarbaker";
                                                const isMicrocirugiaRoom = room === "Sala Microcirugía";
                                                
                                                let isDisabled = false; let disabledReason = "";
                                                if (isSala7 && !isSaturday) { isDisabled = true; disabledReason = "(Solo Sábados)"; }
                                                else if (isStandardRoom && isSundayOrHoliday) { isDisabled = true; disabledReason = "(No disp. Dom/Fest)"; }
                                                else if (isRestrictedRoom && !isSundayOrHoliday) { isDisabled = true; disabledReason = "(Solo Dom/Fest)"; }
                                                else if (isCaderasRoom && !docGroup.includes("caderas")) { isDisabled = true; disabledReason = "(Solo G. Caderas)"; }
                                                else if (isSugarbakerRoom && !docGroup.includes("sugarbaker")) { isDisabled = true; disabledReason = "(Solo G. Sugarbaker)"; }
                                                else if (isMicrocirugiaRoom && !docGroup.includes("microcirug")) { isDisabled = true; disabledReason = "(Solo G. Microcirugía)"; }
                                                else if ((isCaderasRoom || isSugarbakerRoom || isMicrocirugiaRoom) && !shift.person) { isDisabled = true; disabledReason = "(Seleccione Médico)"; }
                                                
                                                return <option key={`${groupName}-${i}`} value={room} disabled={isDisabled}>{room} {disabledReason}</option>
                                            })}
                                        </optgroup>
                                    ))}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                        </div>
                        <div className="md:col-span-2 lg:col-span-4 border-t border-slate-100 pt-5">
                            <label className="flex items-start gap-3 cursor-pointer text-sm font-medium text-slate-700">
                                <input type="checkbox" checked={Boolean(shift.repeatToOtherDates)} onChange={(e) => {
                                    updateShift(shift.id, 'repeatToOtherDates', e.target.checked);
                                    if (!e.target.checked) updateShift(shift.id, 'additionalDates', []);
                                }} className="mt-0.5 w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue" />
                                <span>¿Quieres repetir este cambio en otras fechas?<span className="block mt-1 text-xs font-normal text-slate-500">La persona, jornada y sala se conservarán. Cada fecha se guardará como un cambio individual.</span></span>
                            </label>
                            {shift.repeatToOtherDates && (
                                <div className="mt-4 p-4 bg-blue-50/60 border border-blue-100 rounded-lg">
                                    <label className="text-sm font-medium text-keralty-blue block mb-2">Fechas adicionales</label>
                                    <MultiDateCalendar
                                        selectedDates={additionalDates}
                                        onChange={(dates) => updateShift(shift.id, 'additionalDates', dates)}
                                        allowedTypes={allowedDays}
                                        isDateAllowed={(date) => date !== shift.date && (isRoomNotRequired || !shift.room || isRoomAvailableOnDate(shift.room, date))}
                                    />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };



        const DashboardChoices = ({ onChoose }) => (
            <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-keralty-blue px-6 py-4 flex items-center">
                    <span className="text-keralty-green mr-2"><IconFileText /></span>
                    <h2 className="text-lg font-semibold text-white">Nuevas Solicitudes</h2>
                </div>
                <div className="p-6 bg-slate-50">
                    <p className="text-sm text-slate-600 mb-5">Elige cómo quieres registrar tus cambios de turno.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button type="button" onClick={() => onChoose('individual')} className="action-card text-left bg-white border border-slate-200 rounded-lg p-6 focus:outline-none focus:ring-2 focus:ring-keralty-blue">
                            <span className="w-11 h-11 rounded-lg bg-blue-50 text-keralty-blue flex items-center justify-center mb-4"><IconFileText size={22} /></span>
                            <h3 className="text-lg font-bold text-keralty-blue">Realizar Cambios Individuales</h3>
                            <p className="mt-2 text-sm text-slate-500 leading-relaxed">Registra uno o varios cambios con el formato habitual.</p>
                        </button>
                        <button type="button" onClick={() => onChoose('multiple')} className="action-card text-left bg-white border border-slate-200 rounded-lg p-6 focus:outline-none focus:ring-2 focus:ring-keralty-green">
                            <span className="w-11 h-11 rounded-lg bg-green-50 text-keralty-green flex items-center justify-center mb-4"><IconCalendar size={22} /></span>
                            <h3 className="text-lg font-bold text-keralty-blue">Realizar Cambios Múltiples</h3>
                            <p className="mt-2 text-sm text-slate-500 leading-relaxed">Asigna varias fechas a un mismo médico, definiendo sala y jornada en cada una.</p>
                        </button>
                    </div>
                </div>
            </section>
        );

        const MultipleChangesForm = ({ doctorsList, isLoadingDoctors, changes, onAdd, onRemove, onRemoveLot, onSubmit, isSubmitting, motionEnabled, onBack, setToast, resetKey }) => {
            const createLot = () => ({ id: "lot-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), doctor: "" });
            const initialLotRef = useRef(null);
            if (!initialLotRef.current) initialLotRef.current = createLot();

            const [lots, setLots] = useState([initialLotRef.current]);
            const [activeLotId, setActiveLotId] = useState(initialLotRef.current.id);
            const [draft, setDraft] = useState({ date: "", type: "", room: "" });
            const [showCalendarWarning, setShowCalendarWarning] = useState(false);
            const activeLot = lots.find(lot => lot.id === activeLotId) || lots[0];
            const activeChanges = changes.filter(change => change.lotId === activeLotId);
            const isRoomNotRequired = isRoomNotRequiredForType(draft.type);
            const allowedDays = getAllowedDayTypes(draft.type);
            const draftDayType = getDayType(draft.date);
            const AnimatePresence = motionEnabled && window.Motion ? window.Motion.AnimatePresence : null;

            useEffect(() => {
                const nextLot = createLot();
                setLots([nextLot]);
                setActiveLotId(nextLot.id);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
            }, [resetKey]);

            useEffect(() => {
                if (isRoomNotRequired && draft.room) setDraft(current => ({ ...current, room: "" }));
            }, [isRoomNotRequired, draft.room]);

            const updateDoctor = (name) => {
                setLots(current => current.map(lot => lot.id === activeLotId ? { ...lot, doctor: name } : lot));
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
            };

            const selectLot = (lotId) => {
                setActiveLotId(lotId);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
            };

            const addChange = () => {
                if (!activeLot || !activeLot.doctor) {
                    setToast({ message: "Selecciona primero el médico para este lote.", type: "error" });
                    return;
                }
                if (!draft.type) {
                    setShowCalendarWarning(true);
                    setToast({ message: "Selecciona primero el tipo de jornada.", type: "error" });
                    return;
                }
                if (!draft.date || (!isRoomNotRequired && !draft.room)) {
                    setToast({ message: "Completa la fecha y la sala para agregar el cambio.", type: "error" });
                    return;
                }
                if (!allowedDays.includes(draftDayType)) {
                    setToast({ message: "La jornada seleccionada no está disponible para esta fecha.", type: "error" });
                    return;
                }
                const roomRestriction = !isRoomNotRequired ? getRoomRestriction(draft.room, draft.date, activeLot.doctor, doctorsList) : "";
                if (roomRestriction || (!isRoomNotRequired && !isRoomAvailableOnDate(draft.room, draft.date))) {
                    setToast({ message: roomRestriction || "La sala no está disponible para la fecha seleccionada.", type: "error" });
                    return;
                }
                if (activeChanges.some(change => change.date === draft.date)) {
                    setToast({ message: "Esta fecha ya está incluida en este lote.", type: "warning" });
                    return;
                }

                onAdd({
                    id: Date.now().toString() + "-" + Math.random().toString(36).slice(2, 6),
                    lotId: activeLot.id,
                    person: activeLot.doctor,
                    date: draft.date,
                    type: draft.type,
                    room: isRoomNotRequired ? "N/A" : draft.room
                });
                setDraft(current => ({ date: "", type: current.type, room: "" }));
                setShowCalendarWarning(false);
            };

            const addNewLot = () => {
                if (!activeLot || !activeLot.doctor || activeChanges.length === 0) {
                    setToast({ message: "Agrega al menos un cambio al lote actual antes de crear otro.", type: "warning" });
                    return;
                }
                const nextLot = createLot();
                setLots(current => [...current, nextLot]);
                setActiveLotId(nextLot.id);
                setDraft({ date: "", type: "", room: "" });
                setShowCalendarWarning(false);
            };

            const removeLot = (lotId) => {
                if (lots.length === 1) return;
                const remainingLots = lots.filter(lot => lot.id !== lotId);
                setLots(remainingLots);
                onRemoveLot(lotId);
                if (activeLotId === lotId) {
                    setActiveLotId(remainingLots[0].id);
                    setDraft({ date: "", type: "", room: "" });
                    setShowCalendarWarning(false);
                }
            };

            return (
                <section className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-visible">
                    <div className="bg-keralty-blue px-6 py-4 flex items-center justify-between rounded-t-lg">
                        <div className="flex items-center"><span className="text-keralty-green mr-2"><IconCalendar /></span><h2 className="text-lg font-semibold text-white">Cambios Múltiples</h2></div>
                        <button type="button" onClick={onBack} className="text-sm text-white/90 hover:text-white font-medium">Volver</button>
                    </div>

                    <div className="p-6 bg-slate-50 space-y-6">
                        {lots.length > 1 && (
                            <div className="flex flex-wrap gap-2 pb-5 border-b border-slate-200">
                                {lots.map((lot, index) => (
                                    <div key={lot.id} className="inline-flex items-center">
                                        <button type="button" onClick={() => selectLot(lot.id)} className={`button-press px-3 py-2 text-sm font-medium border rounded-l-lg ${lot.id === activeLotId ? "bg-keralty-blue text-white border-keralty-blue" : "bg-white text-slate-600 border-slate-200 hover:bg-blue-50"}`}>
                                            Lote {index + 1}{lot.doctor ? " · " + lot.doctor.split(" ")[0] : ""}
                                        </button>
                                        {lots.length > 1 && (
                                            <button type="button" onClick={() => removeLot(lot.id)} title={"Eliminar lote " + (index + 1)} className={`button-press p-2 border border-l-0 rounded-r-lg ${lot.id === activeLotId ? "bg-keralty-blue text-white border-keralty-blue hover:bg-blue-900" : "bg-white text-red-500 border-slate-200 hover:bg-red-50"}`}>
                                                <IconTrash size={16} />
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="max-w-xl">
                            <label className="text-sm font-medium text-slate-700 block mb-2">1. Médico asignado para este lote</label>
                            <div className="relative">
                                <select value={activeLot ? activeLot.doctor : ""} onChange={(event) => updateDoctor(event.target.value)} disabled={activeChanges.length > 0} className="w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-500">
                                    <option value="">{isLoadingDoctors ? "Cargando médicos..." : "Selecciona un médico..."}</option>
                                    {doctorsList.map((item, index) => <option key={index} value={item.name}>{item.name}</option>)}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                            {activeChanges.length > 0 && <p className="mt-2 text-xs text-slate-500">El médico queda fijado mientras existan cambios en este lote.</p>}
                        </div>

                        <div className="max-w-xl border-t border-slate-200 pt-6">
                            <label className="text-sm font-medium text-slate-700 block mb-2">2. Tipo de Jornada</label>
                            <div className="relative">
                                <select value={draft.type} onChange={(event) => {
                                    setDraft({ date: "", type: event.target.value, room: "" });
                                    setShowCalendarWarning(false);
                                }} disabled={!activeLot || !activeLot.doctor} className="w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-400">
                                    <option value="">{activeLot && activeLot.doctor ? "Selecciona jornada..." : "Selecciona primero el médico"}</option>
                                    {Object.entries(SHIFT_TYPES).map(([category, types]) => <optgroup key={category} label={category}>{types.map(type => <option key={type} value={category + " - " + type}>{type}</option>)}</optgroup>)}
                                </select>
                                <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                            </div>
                        </div>

                        <div className="border-t border-slate-200 pt-6">
                            <p className="text-sm font-medium text-slate-700 mb-4">3. Fecha y sala para este cambio</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconCalendar /></span> Fecha</label>
                                    {draft.type ? (
                                        <CustomCalendar value={draft.date} onChange={(date) => setDraft(current => ({ ...current, date, room: "" }))} allowedTypes={allowedDays} isDateAllowed={(date) => !activeChanges.some(change => change.date === date)} />
                                    ) : (
                                        <button type="button" onClick={() => setShowCalendarWarning(true)} className="button-press w-full px-3 py-2.5 bg-slate-100 border border-slate-200 rounded-lg flex justify-between items-center text-left text-slate-400">
                                            <span>Seleccionar fecha...</span>
                                            <IconCalendar size={18} />
                                        </button>
                                    )}
                                    {showCalendarWarning && !draft.type && <p className="text-sm font-semibold text-red-600">Selecciona primero el tipo de jornada</p>}
                                </div>

                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-slate-600 flex items-center"><span className="text-slate-400 mr-1"><IconLayout /></span> Sala</label>
                                    <div className="relative">
                                        <select value={draft.room} onChange={(event) => setDraft(current => ({ ...current, room: event.target.value }))} disabled={isRoomNotRequired || !draft.date} className="w-full pl-3 pr-10 py-2.5 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue appearance-none text-slate-700 disabled:bg-slate-100 disabled:text-slate-400">
                                            <option value="">{isRoomNotRequired ? "No aplica" : (draft.date ? "Selecciona sala..." : "Selecciona primero la fecha")}</option>
                                            {Object.entries(ROOMS_GROUPED).map(([groupName, rooms]) => (
                                                <optgroup key={groupName} label={groupName}>
                                                    {rooms.map(room => {
                                                        const reason = getRoomRestriction(room, draft.date, activeLot ? activeLot.doctor : "", doctorsList);
                                                        return <option key={room} value={room} disabled={Boolean(reason)}>{room}{reason ? " (" + reason + ")" : ""}</option>;
                                                    })}
                                                </optgroup>
                                            ))}
                                        </select>
                                        <span className="absolute right-3 top-3 text-slate-400 pointer-events-none"><IconChevronDown /></span>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-5 flex justify-end">
                                <button type="button" onClick={addChange} className="button-press inline-flex items-center px-4 py-2.5 rounded-lg font-medium text-keralty-blue bg-white border border-keralty-blue hover:bg-blue-50">
                                    <span className="mr-2"><IconPlus size={18} /></span> Agregar fecha al lote
                                </button>
                            </div>
                        </div>

                        <div className="border-t border-slate-200 pt-6">
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                                <div>
                                    <h3 className="font-semibold text-keralty-blue">Verificación de lotes</h3>
                                    <p className="text-sm text-slate-500">{lots.length} lote(s) · {changes.length} cambio(s)</p>
                                </div>
                                <button type="button" onClick={addNewLot} className="button-press inline-flex items-center justify-center px-4 py-2.5 rounded-lg font-medium text-keralty-blue bg-white border border-keralty-blue hover:bg-blue-50">
                                    <span className="mr-2"><IconPlus size={18} /></span> Agregar un nuevo lote
                                </button>
                            </div>

                            {changes.length === 0 ? (
                                <div className="border border-dashed border-slate-300 rounded-lg p-5 text-sm text-slate-500 text-center bg-white">Agrega las fechas que deseas enviar para el médico seleccionado.</div>
                            ) : (
                                <div className="space-y-4">
                                    {lots.map((lot, lotIndex) => {
                                        const lotChanges = changes.filter(change => change.lotId === lot.id).sort((first, second) => first.date.localeCompare(second.date));
                                        if (lotChanges.length === 0) return null;
                                        return (
                                            <div key={lot.id} className="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                                <div className="px-4 py-3 bg-slate-100 border-b border-slate-200 flex items-center justify-between gap-3">
                                                    <div>
                                                        <p className="text-xs font-bold uppercase text-slate-500">Lote {lotIndex + 1}</p>
                                                        <p className="text-sm font-semibold text-keralty-blue">{lot.doctor}</p>
                                                    </div>
                                                    <button type="button" onClick={() => selectLot(lot.id)} className="button-press text-xs font-medium text-keralty-blue hover:text-blue-900">Editar lote</button>
                                                </div>
                                                <div className="divide-y divide-slate-100">
                                                    {AnimatePresence ? <AnimatePresence initial={false}>{lotChanges.map(change => (
                                                        <MotionView key={change.id} enabled={motionEnabled} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, x: -8 }} transition={{ duration: 0.2 }} className="px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                            <p className="text-sm text-slate-700"><strong>{change.date}</strong><span className="text-slate-400 mx-2">-</span>{change.room}<span className="text-slate-400 mx-2">-</span>{change.type}</p>
                                                            <button type="button" onClick={() => onRemove(change.id)} className="button-press text-sm text-red-600 hover:text-red-700 font-medium inline-flex items-center"><IconTrash size={16} className="mr-1" /> Eliminar</button>
                                                        </MotionView>
                                                    ))}</AnimatePresence> : lotChanges.map(change => (
                                                        <div key={change.id} className="px-4 py-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                            <p className="text-sm text-slate-700"><strong>{change.date}</strong><span className="text-slate-400 mx-2">-</span>{change.room}<span className="text-slate-400 mx-2">-</span>{change.type}</p>
                                                            <button type="button" onClick={() => onRemove(change.id)} className="button-press text-sm text-red-600 hover:text-red-700 font-medium inline-flex items-center"><IconTrash size={16} className="mr-1" /> Eliminar</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            <div className="mt-5 flex justify-end">
                                <button type="button" onClick={onSubmit} disabled={isSubmitting || changes.length === 0} className="button-press inline-flex items-center justify-center px-6 py-3 rounded-lg font-medium text-white bg-keralty-green hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed">
                                    {isSubmitting ? <IconRefresh className="animate-spin mr-2" /> : <span className="mr-2"><IconSave /></span>} Guardar y Enviar todos los lotes
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [fadeSplash, setFadeSplash] = useState(false);

            const [user, setUser] = useState(null);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [authMode, setAuthMode] = useState('login');
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', password: '', confirmPassword: '' });
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordData, setPasswordData] = useState({ old: '', new: '', confirm: '' });
            const [showEmailLogin, setShowEmailLogin] = useState(false);
            
            const [shifts, setShifts] = useState([{ id: '1', person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [validationError, setValidationError] = useState("");
            const [toast, setToast] = useState(null);
            
            // NUEVOS ESTADOS PARA HISTORIAL Y CANCELACIÓN
            const [history, setHistory] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [selectedHistory, setSelectedHistory] = useState([]);
            const [showCancelModal, setShowCancelModal] = useState(false);
            const [isCancelling, setIsCancelling] = useState(false);
            const [activeView, setActiveView] = useState('home');
            const [batchChanges, setBatchChanges] = useState([]);
            const [batchSessionKey, setBatchSessionKey] = useState(0);
            const [showHistory, setShowHistory] = useState(false);
            const [historyLoaded, setHistoryLoaded] = useState(false);
            const [motionEnabled, setMotionEnabled] = useState(false);

            const [doctorsList, setDoctorsList] = useState([]);
            const [isLoadingDoctors, setIsLoadingDoctors] = useState(true);
            const [isPendingApproval, setIsPendingApproval] = useState(false);
            
            const parseJwt = (token) => { try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; } };

            // ANIMACIÓN DEL SPLASH SCREEN
            useEffect(() => {
                const timer1 = setTimeout(() => setFadeSplash(true), 2000);
                const timer2 = setTimeout(() => setShowSplash(false), 2500);
                return () => { clearTimeout(timer1); clearTimeout(timer2); };
            }, []);

            useEffect(() => {
                // AQUI ESTÁ LA SOLUCIÓN DEL BOTÓN DE GOOGLE:
                // Esperamos a que showSplash sea false para renderizar el botón
                if (showSplash || user || authMode !== 'login' || isPendingApproval) return;
                
                const initGoogleSignIn = () => {
                    if (window.google && document.getElementById("googleSignInDiv")) {
                        window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleResponse });
                        window.google.accounts.id.renderButton(document.getElementById("googleSignInDiv"), { theme: "outline", size: "large", width: "100%", shape: "rectangular" });
                    }
                };
                
                const scriptId = 'google-gsi-client';
                if (!document.getElementById(scriptId)) {
                    const script = document.createElement('script'); script.id = scriptId; script.src = 'https://accounts.google.com/gsi/client'; script.async = true; script.onload = initGoogleSignIn;
                    document.body.appendChild(script);
                } else { setTimeout(initGoogleSignIn, 100); }
            }, [showSplash, user, authMode, isPendingApproval]); // Añadimos showSplash a las dependencias

            useEffect(() => {
                const fetchDoctors = async () => {
                    setIsLoadingDoctors(true);
                    try {
                        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getDoctors`);
                        const result = await response.json();
                        if (result.status === 'success') setDoctorsList(result.data);
                        else throw new Error(result.message);
                    } catch (error) {
                        setDoctorsList(FALLBACK_DOCTORS);
                        setToast({ message: "No se pudo conectar a Sheets. Usando lista temporal.", type: "warning" });
                    } finally { setIsLoadingDoctors(false); }
                };
                fetchDoctors();
            }, []);

            useEffect(() => {
                if (!user || motionEnabled) return;
                if (window.Motion && window.Motion.motion) {
                    setMotionEnabled(true);
                    return;
                }
                const existing = document.getElementById('turnosync-motion');
                if (existing) return;
                const script = document.createElement('script');
                script.id = 'turnosync-motion';
                script.src = 'https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js';
                script.async = true;
                script.onload = () => {
                    if (window.Motion && window.Motion.motion) setMotionEnabled(true);
                };
                document.body.appendChild(script);
            }, [user, motionEnabled]);

            // EL HISTORIAL SE CARGA SOLO CUANDO EL USUARIO LO SOLICITA
            useEffect(() => {
                if (user) {
                    loadHistoryFromDB();
                }
            }, [user]);

            const loadHistoryFromDB = async () => {
                if (!user) return;
                setIsLoadingHistory(true);
                try {
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getHistory&email=${encodeURIComponent(user.email)}`);
                    const result = await response.json();
                    if (result.status === 'success') {
                        setHistory(result.data);
                    }
                } catch (err) {
                    console.error("Error cargando historial", err);
                } finally {
                    setHistoryLoaded(true);
                    setIsLoadingHistory(false);
                }
            };

            const handleHistoryToggle = () => {
                if (showHistory) {
                    setShowHistory(false);
                    return;
                }
                setShowHistory(true);
                if (!historyLoaded) loadHistoryFromDB();
            };

            const handleGoogleResponse = async (response) => {
                setIsLoggingIn(true);
                try {
                    const payload = parseJwt(response.credential);
                    if (payload && payload.email) {
                        const params = new URLSearchParams({
                            action: 'googleAuth',
                            email: payload.email,
                            name: payload.name,
                            photoUrl: payload.picture || ""
                        });
                        const res = await fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`);
                        const result = await res.json();

                        if (result.status === 'success') {
                            setUser(result.user);
                        } else if (result.status === 'pending' || (result.message && result.message.includes('pendiente'))) {
                            setIsPendingApproval(true);
                            if (window.google) window.google.accounts.id.disableAutoSelect();
                        } else {
                            setToast({ message: result.message || "No autorizado.", type: "warning" });
                            if (window.google) window.google.accounts.id.disableAutoSelect();
                        }
                    } else {
                        setToast({ message: "No se pudo extraer la información de Google.", type: "error" });
                    }
                } catch (error) { 
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally { 
                    setIsLoggingIn(false); 
                }
            };

            const handleEmailLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({
                        action: 'login',
                        email: formData.email,
                        password: formData.password
                    });
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`);
                    const result = await response.json();

                    if (result.status === 'success') {
                        setUser(result.user);
                    } else if (result.status === 'pending' || (result.message && result.message.includes('pendiente'))) {
                        setIsPendingApproval(true);
                    } else {
                        setToast({ message: result.message || "Credenciales incorrectas.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({ action: 'resetPassword', email: formData.email });
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`);
                    const result = await response.json();

                    if (result.status === 'success') {
                        setToast({ message: "Se ha enviado una nueva contraseña a tu correo.", type: "success" });
                        setAuthMode('login');
                        setShowEmailLogin(false);
                        setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' });
                    } else {
                        setToast({ message: result.message || "Error al restablecer contraseña.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (formData.password !== formData.confirmPassword) {
                    return setToast({ message: "Las contraseñas no coinciden.", type: "error" });
                }
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({
                        action: 'register',
                        name: formData.name,
                        email: formData.email,
                        phone: formData.phone,
                        password: formData.password
                    });
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`);
                    const result = await response.json();

                    if (result.status === 'success' || result.status === 'pending') {
                        setIsPendingApproval(true);
                    } else {
                        setToast({ message: result.message || "Error al crear cuenta.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                if (passwordData.new !== passwordData.confirm) return setToast({ message: "Las contraseñas nuevas no coinciden.", type: "error" });
                if (passwordData.new.length < 6) return setToast({ message: "La nueva contraseña debe tener al menos 6 caracteres.", type: "error" });
                
                setIsSubmitting(true);
                try {
                    const params = new URLSearchParams({
                        action: 'changePassword',
                        email: user.email,
                        oldPassword: passwordData.old,
                        newPassword: passwordData.new
                    });
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`);
                    const result = await response.json();

                    if (result.status === 'success') {
                        setToast({ message: "Contraseña actualizada exitosamente.", type: "success" });
                        setShowPasswordModal(false);
                        setPasswordData({ old: '', new: '', confirm: '' });
                    } else {
                        setToast({ message: result.message || "Error al actualizar contraseña.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleLogout = () => { 
                setUser(null); setShifts([{ id: '1', person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]); setBatchChanges([]); setActiveView('home'); setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' }); setValidationError(""); setShowEmailLogin(false);
                if (window.google) window.google.accounts.id.disableAutoSelect();
            };
            const addShift = () => { setValidationError(""); setShifts(current => [...current, { id: Date.now().toString(), person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]); };
            const removeShift = (id) => { setValidationError(""); setShifts(current => current.filter(s => s.id !== id)); };
            const updateShift = (id, field, value) => { setValidationError(""); setShifts(current => current.map(s => s.id === id ? { ...s, [field]: value } : s)); };

            const sendChangesToBackend = async (changes) => {
                const payload = {
                    solicitante: user.name,
                    correoSolicitante: user.email,
                    cambios: changes.map(shift => ({
                        persona: shift.person,
                        jornada: shift.type,
                        fecha: shift.date,
                        sala: isRoomNotRequiredForType(shift.type) ? "N/A" : shift.room,
                        timestamp: new Date().toISOString()
                    }))
                };
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            };

            const refreshHistoryAfterWrite = () => {
                setHistoryLoaded(false);
                if (showHistory) setTimeout(() => loadHistoryFromDB(), 2000);
            };

            const handleBatchAdd = (change) => {
                setBatchChanges(current => [...current, change].sort((first, second) => first.date.localeCompare(second.date)));
            };

            const handleBatchSubmit = async () => {
                if (batchChanges.length === 0 || batchChanges.some(change => !change.person)) return;
                setIsSubmitting(true);
                try {
                    await sendChangesToBackend(batchChanges);
                    setToast({ message: batchChanges.length + " solicitud(es) guardada(s) correctamente.", type: "success" });
                    setBatchChanges([]);
                    setBatchSessionKey(current => current + 1);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al guardar los cambios múltiples.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSubmit = async () => {
                const individualShifts = shifts.flatMap(shift => {
                    const dates = [shift.date, ...(shift.repeatToOtherDates ? (shift.additionalDates || []) : [])];
                    return [...new Set(dates.filter(Boolean))].map(date => ({ ...shift, date }));
                });

                const isValid = individualShifts.every(shift => (
                    shift.person &&
                    shift.type &&
                    shift.date &&
                    (shift.type.includes("Nocturnos") || shift.type.includes("Disponibilidad") || shift.type.includes("Extendido") || shift.room)
                ));
                const hasUnavailableRoom = individualShifts.some(shift => (
                    !shift.type.includes("Nocturnos") &&
                    !shift.type.includes("Disponibilidad") &&
                    !shift.type.includes("Extendido") &&
                    !isRoomAvailableOnDate(shift.room, shift.date)
                ));

                if (!isValid) {
                    setValidationError("⚠️ Faltan campos por diligenciar en uno o más turnos.");
                    return setToast({ message: "Completa todos los campos obligatorios.", type: "error" });
                }
                if (hasUnavailableRoom) {
                    setValidationError("⚠️ Una sala no está disponible para una de las fechas seleccionadas.");
                    return setToast({ message: "Ajusta la sala o las fechas adicionales antes de guardar.", type: "error" });
                }

                setValidationError("");
                setIsSubmitting(true);
                try {
                    await sendChangesToBackend(individualShifts);
                    setToast({ message: individualShifts.length + " solicitud(es) guardada(s) correctamente.", type: "success" });
                    setShifts([{ id: Date.now().toString(), person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al guardar.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            // MANEJO DE SELECCIÓN PARA ELIMINAR TURNOS
            const handleSelectHistory = (rowId, isChecked) => {
                if (isChecked) {
                    setSelectedHistory([...selectedHistory, rowId]);
                } else {
                    setSelectedHistory(selectedHistory.filter(id => id !== rowId));
                }
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    setSelectedHistory(history.map(h => h.rowId));
                } else {
                    setSelectedHistory([]);
                }
            };

            const executeCancel = async () => {
                setIsCancelling(true);
                try {
                    const shiftsToCancel = history.filter(h => selectedHistory.includes(h.rowId));
                    const payload = {
                        action: 'cancelShifts',
                        solicitante: user.name,
                        correoSolicitante: user.email,
                        shifts: shiftsToCancel
                    };
                    
                    await fetch(GOOGLE_SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload) 
                    });
                    
                    setToast({ message: "Turno(s) cancelado(s) correctamente.", type: "success" });
                    setShowCancelModal(false);
                    setSelectedHistory([]);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al cancelar los turnos.", type: "error" });
                } finally {
                    setIsCancelling(false);
                }
            };


            const AnimatePresence = motionEnabled && window.Motion ? window.Motion.AnimatePresence : null;
            const requestView = activeView === 'home' ? (
                <MotionView key="home" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                    <DashboardChoices onChoose={setActiveView} />
                </MotionView>
            ) : activeView === 'individual' ? (
                <MotionView key="individual" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                    <div className="mb-3">
                        <button type="button" onClick={() => setActiveView('home')} className="button-press text-sm font-medium text-keralty-blue hover:text-blue-900">Volver a Nuevas Solicitudes</button>
                    </div>
                        <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-visible">
                            <div className="bg-keralty-blue px-6 py-4 flex items-center rounded-t-xl"><span className="text-keralty-green mr-2"><IconFileText /></span><h2 className="text-lg font-semibold text-white">Nuevas Solicitudes</h2></div>
                            <div className="p-6 bg-slate-50 rounded-b-xl">
                                {shifts.map((shift, idx) => <ShiftEntry key={shift.id} shift={shift} index={idx} updateShift={updateShift} removeShift={removeShift} doctorsList={doctorsList} isLoadingDoctors={isLoadingDoctors}/>)}
                                <div className="mt-4 flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
                                    <button onClick={addShift} className="flex items-center text-keralty-blue font-medium px-4 py-2 border border-dashed border-keralty-blue hover:bg-blue-50 rounded-lg justify-center transition-colors"><span className="mr-1"><IconPlus /></span> Agregar otro</button>
                                    <div className="flex flex-col items-end w-full sm:w-auto">
                                        {validationError && <div className="text-red-500 text-sm font-bold mb-2 animate-bounce-short">{validationError}</div>}
                                        <button onClick={handleSubmit} disabled={isSubmitting} className="w-full sm:w-auto flex items-center justify-center px-6 py-3 rounded-xl font-medium text-white bg-keralty-green hover:opacity-90 transition-opacity">
                                            {isSubmitting ? <IconRefresh className="animate-spin mr-2" /> : <span className="mr-2"><IconSave /></span>} Guardar Solicitudes
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>


                </MotionView>
            ) : (
                <MotionView key="multiple" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                    <MultipleChangesForm
                        doctorsList={doctorsList}
                        isLoadingDoctors={isLoadingDoctors}
                        changes={batchChanges}
                        onAdd={handleBatchAdd}
                        onRemove={(id) => setBatchChanges(current => current.filter(change => change.id !== id))}
                        onRemoveLot={(lotId) => setBatchChanges(current => current.filter(change => change.lotId !== lotId))}
                        onSubmit={handleBatchSubmit}
                        isSubmitting={isSubmitting}
                        motionEnabled={motionEnabled}
                        onBack={() => setActiveView('home')}
                        setToast={setToast}
                        resetKey={batchSessionKey}
                    />
                </MotionView>
            );

            // RENDERIZADO DEL SPLASH SCREEN
            if (showSplash) {
                return (
                    <div className={`fixed inset-0 z-[9999] bg-white flex flex-col items-center justify-center transition-opacity duration-500 ease-in-out ${fadeSplash ? 'opacity-0' : 'opacity-100'}`}>
                        <div className="animate-bounce-short">
                            <img src="https://lh3.googleusercontent.com/d/1R09YUf7Fk8OS4nA2603qtIsEqRr9CxXb" alt="Keralty" className="h-20 object-contain mb-4" />
                        </div>
                        <h1 className="text-4xl font-bold text-keralty-blue animate-fade-in">TurnoSync</h1>
                        <p className="text-slate-500 mt-2 font-medium animate-fade-in" style={{ animationDelay: '0.2s' }}>Gestión de Turnos</p>
                        <div className="mt-10 w-10 h-10 border-4 border-slate-200 border-t-keralty-green rounded-full animate-spin"></div>
                    </div>
                );
            }

            if (isPendingApproval) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 py-8 bg-slate-100">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-amber-400 animate-fade-in">
                            <div className="mx-auto w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mb-6">
                                <IconClock size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-4">Autorización Pendiente</h2>
                            <p className="text-slate-600 mb-6 leading-relaxed">
                                Tu cuenta ha sido registrada correctamente. <strong className="text-slate-800 block mt-2">Una vez el administrador le dé acceso se le enviará un correo indicando que ya puede entrar.</strong>
                            </p>
                            <button onClick={() => window.location.reload()} className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-slate-700 bg-slate-50 hover:bg-slate-200 border border-slate-200 transition-colors">
                                <IconRefresh size={18} className="mr-2" /> Recargar página
                            </button>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 py-8 bg-slate-100">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-keralty-green transition-all">
                            <img src="https://lh3.googleusercontent.com/d/1R09YUf7Fk8OS4nA2603qtIsEqRr9CxXb" alt="Keralty" className="h-12 mx-auto mb-6 object-contain" />
                            <h2 className="text-3xl font-bold text-keralty-blue">Ayudantes CUC/PA</h2>
                            <p className="text-slate-500 mt-2 mb-6">Portal de Gestión Cambios de Turno</p>
                            
                            {authMode === 'register' ? (
                                <form onSubmit={handleRegister} className="space-y-4 text-left animate-fade-in">
                                    <h3 className="font-bold text-lg text-slate-700 text-center mb-4">Crear una cuenta nueva</h3>
