                <div key={entry.rowId} className={`px-4 py-3 flex items-start gap-3 ${selectedIds.includes(entry.rowId) ? "bg-blue-50/60" : "bg-white"}`}>
                    <input
                        type="checkbox"
                        checked={selectedIds.includes(entry.rowId)}
                        onChange={(event) => onSelectIds([entry.rowId], event.target.checked)}
                        className="mt-1 w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue cursor-pointer"
                    />
                    <div className="flex-1 grid grid-cols-1 sm:grid-cols-5 gap-1 sm:gap-3 text-sm">
                        <span className="font-semibold text-slate-800">{entry.fecha}</span>
                        <span className="sm:col-span-2 text-keralty-blue font-medium">{entry.persona}</span>
                        <span className="text-slate-600">{formatShiftLabel(entry.jornada)}</span>
                        <span className="text-slate-500">{entry.sala}</span>
                    </div>
                    <span className="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-keralty-green text-white">{entry.estado}</span>
                </div>
            );

            return (
                <section>
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                        <h3 className="text-lg font-bold text-keralty-blue flex items-center"><span className="text-keralty-green mr-2"><IconClock /></span> Registro de Cambios de Turnos</h3>
                        <button type="button" onClick={onToggle} className="button-press inline-flex items-center justify-center px-4 py-2 rounded-lg text-sm font-medium text-keralty-blue bg-white border border-slate-200 hover:bg-blue-50">
                            {show ? "Ocultar Registro de Cambios" : "Mostrar Registro de Cambios"}
                        </button>
                    </div>

                    {show && (
                        <MotionView enabled={motionEnabled} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.22 }}>
                            {isLoading ? (
                                <div className="bg-white shadow-sm rounded-lg border border-slate-200 p-8 text-center text-slate-600">
                                    <div className="loading-dots mb-3"><span></span><span></span><span></span></div>
                                    <p className="text-sm font-medium">Un momento, se están cargando tus cambios</p>
                                </div>
                            ) : history.length === 0 ? (
                                <div className="bg-white border border-slate-200 rounded-lg p-8 text-center text-slate-500">No tienes turnos pendientes a futuro solicitados por ti.</div>
                            ) : (
                                <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
                                    <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3">
                                        <label className="flex items-center text-sm font-medium text-slate-700 cursor-pointer">
                                            <input type="checkbox" checked={allSelected} onChange={(event) => onSelectIds(history.map(entry => entry.rowId), event.target.checked)} className="mr-3 w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue cursor-pointer" />
                                            Seleccionar todos
                                        </label>
                                        <span className="text-xs text-slate-500">{history.length} cambio(s)</span>
                                    </div>

                                    <div className="divide-y divide-slate-200">
                                        {orderedDates.map(dateKey => {
                                            const entries = dateGroups[dateKey];
                                            const dateIds = entries.map(entry => entry.rowId);
                                            const dateSelected = dateIds.every(id => selectedIds.includes(id));
                                            const isExpanded = Boolean(expandedDates[dateKey]);
                                            const multipleEntries = entries.filter(entry => entry.modo === "multiple" || entry.grupoId);
                                            const individualEntries = entries.filter(entry => !(entry.modo === "multiple" || entry.grupoId));
                                            const multipleGroups = multipleEntries.reduce((groups, entry) => {
                                                const key = entry.grupoId || "multiple-" + dateKey;
                                                if (!groups[key]) groups[key] = [];
                                                groups[key].push(entry);
                                                return groups;
                                            }, {});

                                            return (
                                                <div key={dateKey}>
                                                    <div className="p-4 bg-white flex items-center gap-3">
                                                        <input type="checkbox" checked={dateSelected} onChange={(event) => setChecked(event, dateIds)} aria-label={"Seleccionar todos los cambios enviados el " + dateKey} className="w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue cursor-pointer" />
                                                        <button type="button" onClick={() => setExpandedDates(current => ({ ...current, [dateKey]: !isExpanded }))} className="button-press flex-1 flex items-center justify-between text-left">
                                                            <span className="font-semibold text-keralty-blue">Cambios enviados el día {dateKey}</span>
                                                            <span className={`text-slate-400 transition-transform ${isExpanded ? "rotate-180" : ""}`}><IconChevronDown /></span>
                                                        </button>
                                                    </div>

                                                    {isExpanded && (
                                                        <div className="border-t border-slate-100 bg-slate-50 p-3 space-y-3">
                                                            {individualEntries.length > 0 && (
                                                                <div className="border border-slate-200 rounded-lg overflow-hidden">
                                                                    <div className="px-4 py-2 bg-slate-100 text-xs font-bold text-slate-600">Cambios individuales</div>
                                                                    <div className="divide-y divide-slate-100">{individualEntries.map(renderEntry)}</div>
                                                                </div>
                                                            )}
                                                            {Object.entries(multipleGroups).map(([groupId, groupEntries], groupIndex) => {
                                                                const groupIds = groupEntries.map(entry => entry.rowId);
                                                                const groupSelected = groupIds.every(id => selectedIds.includes(id));
                                                                return (
                                                                    <div key={groupId} className="border border-blue-200 rounded-lg overflow-hidden">
                                                                        <div className="px-4 py-2.5 bg-blue-50 flex items-center gap-3">
                                                                            <input type="checkbox" checked={groupSelected} onChange={(event) => setChecked(event, groupIds)} aria-label={"Seleccionar todo el grupo múltiple " + (groupIndex + 1)} className="w-4 h-4 text-keralty-blue rounded border-slate-300 focus:ring-keralty-blue cursor-pointer" />
                                                                            <span className="text-xs font-bold text-keralty-blue">Grupo de Cambios Múltiples #{groupIndex + 1}</span>
                                                                        </div>
                                                                        <div className="divide-y divide-slate-100">{groupEntries.map(renderEntry)}</div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {selectedIds.length > 0 && (
                                        <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                                            <button type="button" onClick={onRequestDelete} className="button-press flex justify-center items-center px-4 py-2.5 bg-red-500 text-white rounded-lg hover:bg-red-600 shadow-sm font-medium w-full md:w-auto">
                                                <IconTrash size={18} className="mr-2" /> Eliminar {selectedIds.length} cambio(s)
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </MotionView>
                    )}
                </section>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [fadeSplash, setFadeSplash] = useState(false);

            const [user, setUser] = useState(null);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [authMode, setAuthMode] = useState('login');
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', password: '', confirmPassword: '' });
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordData, setPasswordData] = useState({ old: '', new: '', confirm: '' });
            const [showEmailLogin, setShowEmailLogin] = useState(false);
            
            const [shifts, setShifts] = useState([{ id: '1', person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [validationError, setValidationError] = useState("");
            const [shiftFieldErrors, setShiftFieldErrors] = useState({});
            const [individualValidationCycle, setIndividualValidationCycle] = useState(0);
            const [individualSubmitSummary, setIndividualSubmitSummary] = useState(null);
            const [toast, setToast] = useState(null);
            
            // NUEVOS ESTADOS PARA HISTORIAL Y CANCELACIÓN
            const [history, setHistory] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);
            const [selectedHistory, setSelectedHistory] = useState([]);
            const [showCancelModal, setShowCancelModal] = useState(false);
            const [showLogoutWarning, setShowLogoutWarning] = useState(false);
            const [hasUnsavedMultipleChanges, setHasUnsavedMultipleChanges] = useState(false);
            const [isCancelling, setIsCancelling] = useState(false);
            const [activeView, setActiveView] = useState('home');
            const [batchChanges, setBatchChanges] = useState([]);
            const [batchSessionKey, setBatchSessionKey] = useState(0);
            const [showHistory, setShowHistory] = useState(false);
            const [historyLoaded, setHistoryLoaded] = useState(false);
            const [motionEnabled, setMotionEnabled] = useState(false);

            const [doctorsList, setDoctorsList] = useState([]);
            const [isLoadingDoctors, setIsLoadingDoctors] = useState(true);
            const [isPendingApproval, setIsPendingApproval] = useState(false);
            const doctorsLoadedRef = useRef(false);

            useEffect(() => {
                setShowHistory(false);
                setSelectedHistory([]);
                setShiftFieldErrors({});
                setValidationError("");
            }, [activeView]);
            
            const parseJwt = (token) => { try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; } };

            // ANIMACIÓN DEL SPLASH SCREEN
            useEffect(() => {
                const timer1 = setTimeout(() => setFadeSplash(true), 2000);
                const timer2 = setTimeout(() => setShowSplash(false), 2500);
                return () => { clearTimeout(timer1); clearTimeout(timer2); };
            }, []);

            useEffect(() => {
                // AQUI ESTÁ LA SOLUCIÓN DEL BOTÓN DE GOOGLE:
                // Esperamos a que showSplash sea false para renderizar el botón
                if (user || authMode !== 'login' || isPendingApproval) return;
                
                const initGoogleSignIn = () => {
                    if (window.google && document.getElementById("googleSignInDiv")) {
                        window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleResponse });
                        window.google.accounts.id.renderButton(document.getElementById("googleSignInDiv"), { theme: "outline", size: "large", width: "100%", shape: "rectangular" });
                    }
                };
                
                const scriptId = 'google-gsi-client';
                if (!document.getElementById(scriptId)) {
                    const script = document.createElement('script'); script.id = scriptId; script.src = 'https://accounts.google.com/gsi/client'; script.async = true; script.onload = initGoogleSignIn;
                    document.body.appendChild(script);
                } else { setTimeout(initGoogleSignIn, 100); }
            }, [showSplash, user, authMode, isPendingApproval]); // Añadimos showSplash a las dependencias

            useEffect(() => {
                if (!user || doctorsLoadedRef.current) return;
                doctorsLoadedRef.current = true;
                const timer = window.setTimeout(async () => {
                    setIsLoadingDoctors(true);
                    try {
                        const result = await backendGet({ action: "getDoctors" });
                        if (result.status === "success") setDoctorsList(result.data);
                        else throw new Error(result.message);
                    } catch (error) {
                        doctorsLoadedRef.current = false;
                        setDoctorsList(FALLBACK_DOCTORS);
                        setToast({ message: "No se pudo conectar a Sheets. Usando lista temporal.", type: "warning" });
                    } finally {
                        setIsLoadingDoctors(false);
                    }
                }, 0);
                return () => window.clearTimeout(timer);
            }, [user]);

            useEffect(() => {
                if (!user || motionEnabled) return;
                if (window.Motion && window.Motion.motion) {
                    setMotionEnabled(true);
                    return;
                }
                const existing = document.getElementById('turnosync-motion');
                if (existing) return;
                const script = document.createElement('script');
                script.id = 'turnosync-motion';
                script.src = 'https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js';
                script.async = true;
                script.onload = () => {
                    if (window.Motion && window.Motion.motion) setMotionEnabled(true);
                };
                document.body.appendChild(script);
            }, [user, motionEnabled]);

            // El historial se solicita únicamente al abrir su sección.
            const loadHistoryFromDB = async () => {
                if (!user) return;
                setIsLoadingHistory(true);
                try {
                    const result = await backendGet({ action: "getHistory", email: user.email });
                    if (result.status === 'success') {
                        setHistory(result.data);
                    }
                } catch (err) {
                    console.error("Error cargando historial", err);
                } finally {
                    setHistoryLoaded(true);
                    setIsLoadingHistory(false);
                }
            };

            const handleHistoryToggle = () => {
                if (showHistory) {
                    setShowHistory(false);
                    return;
                }
                setShowHistory(true);
                if (!historyLoaded) loadHistoryFromDB();
            };

            const handleGoogleResponse = async (response) => {
                setIsLoggingIn(true);
                try {
                    const payload = parseJwt(response.credential);
                    if (payload && payload.email) {
                        const params = new URLSearchParams({
                            action: 'googleAuth',
                            email: payload.email,
                            name: payload.name,
                            photoUrl: payload.picture || ""
                        });
                        const result = await backendGet(params);

                        if (result.status === 'success') {
                            setUser(result.user);
                        } else if (result.status === 'pending' || (result.message && result.message.includes('pendiente'))) {
                            setIsPendingApproval(true);
                            if (window.google) window.google.accounts.id.disableAutoSelect();
                        } else {
                            setToast({ message: result.message || "No autorizado.", type: "warning" });
                            if (window.google) window.google.accounts.id.disableAutoSelect();
                        }
                    } else {
                        setToast({ message: "No se pudo extraer la información de Google.", type: "error" });
                    }
                } catch (error) { 
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally { 
                    setIsLoggingIn(false); 
                }
            };

            const handleEmailLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({
                        action: 'login',
                        email: formData.email,
                        password: formData.password
                    });
                    const result = await backendGet(params);

                    if (result.status === 'success') {
                        setUser(result.user);
                    } else if (result.status === 'pending' || (result.message && result.message.includes('pendiente'))) {
                        setIsPendingApproval(true);
                    } else {
                        setToast({ message: result.message || "Credenciales incorrectas.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({ action: 'resetPassword', email: formData.email });
                    const result = await backendGet(params);

                    if (result.status === 'success') {
                        setToast({ message: "Se ha enviado una nueva contraseña a tu correo.", type: "success" });
                        setAuthMode('login');
                        setShowEmailLogin(false);
                        setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' });
                    } else {
                        setToast({ message: result.message || "Error al restablecer contraseña.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (formData.password !== formData.confirmPassword) {
                    return setToast({ message: "Las contraseñas no coinciden.", type: "error" });
                }
                setIsLoggingIn(true);
                try {
                    const params = new URLSearchParams({
                        action: 'register',
                        name: formData.name,
                        email: formData.email,
                        phone: formData.phone,
                        password: formData.password
                    });
                    const result = await backendGet(params);

                    if (result.status === 'success' || result.status === 'pending') {
                        setIsPendingApproval(true);
                    } else {
                        setToast({ message: result.message || "Error al crear cuenta.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                if (passwordData.new !== passwordData.confirm) return setToast({ message: "Las contraseñas nuevas no coinciden.", type: "error" });
                if (passwordData.new.length < 6) return setToast({ message: "La nueva contraseña debe tener al menos 6 caracteres.", type: "error" });
                
                setIsSubmitting(true);
                try {
                    const params = new URLSearchParams({
                        action: 'changePassword',
                        email: user.email,
                        oldPassword: passwordData.old,
                        newPassword: passwordData.new
                    });
                    const result = await backendGet(params);

                    if (result.status === 'success') {
                        setToast({ message: "Contraseña actualizada exitosamente.", type: "success" });
                        setShowPasswordModal(false);
                        setPasswordData({ old: '', new: '', confirm: '' });
                    } else {
                        setToast({ message: result.message || "Error al actualizar contraseña.", type: "error" });
                    }
                } catch (error) {
                    setToast({ message: "Error de conexión con el servidor.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const completeLogout = () => {
                setShowLogoutWarning(false);
                setHasUnsavedMultipleChanges(false);
                setUser(null);
                setShifts([{ id: '1', person: '', type: '', date: '', room: '', repeatToOtherDates: false, additionalDates: [] }]);
                setBatchChanges([]);
                setActiveView('home');
                setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' });
                setValidationError("");
                setShowEmailLogin(false);
                if (window.google) window.google.accounts.id.disableAutoSelect();
            };

            const handleLogout = () => {
                if (hasUnsavedMultipleChanges) {
                    setShowLogoutWarning(true);
                    return;
                }
                completeLogout();
            };
            const addShift = () => { setValidationError(""); setShifts(current => [...current, { id: Date.now().toString(), person: "", type: "", date: "", room: "", repeatToOtherDates: false, additionalDates: [] }]); };
            const removeShift = (id) => {
                setValidationError("");
                setShiftFieldErrors(current => {
                    const next = { ...current };
                    delete next[id];
                    return next;
                });
                setShifts(current => current.filter(shift => shift.id !== id));
            };
            const updateShift = (id, field, value) => {
                setValidationError("");
                setShiftFieldErrors(current => ({
                    ...current,
                    [id]: { ...(current[id] || {}), [field]: undefined }
                }));
                setShifts(current => current.map(shift => shift.id === id ? { ...shift, [field]: value } : shift));
            };
            const isIndividualComplete = shifts.length > 0 && shifts.every(shift => (
                Object.keys(getShiftFieldErrors(shift)).length === 0 &&
                (isRoomNotRequiredForType(shift.type) || (
                    isRoomAvailableOnDate(shift.room, shift.date) &&
                    !getRoomRestriction(shift.room, shift.date, shift.person, doctorsList)
                ))
            ));

            const sendChangesToBackend = async (changes, mode = "individual") => {
                const submissionId = mode + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
                const submittedAt = new Date().toISOString();
                const payload = {
                    solicitante: user.name,
                    correoSolicitante: user.email,
                    modo: mode,
                    submissionId,
                    cambios: changes.map(shift => ({
                        persona: shift.person,
                        jornada: shift.type,
                        fecha: shift.date,
                        sala: isRoomNotRequiredForType(shift.type) ? "N/A" : shift.room,
                        timestamp: submittedAt,
                        modo: mode,
                        grupoId: mode === "multiple" ? submissionId + "::" + (shift.lotId || "grupo") : ""
                    }))
                };
                const result = await backendPost(payload);
                if (result.status && result.status !== "success") throw new Error(result.message || "No se pudo guardar");
            };

            const refreshHistoryAfterWrite = () => {
                setHistoryLoaded(false);
                if (showHistory) setTimeout(() => loadHistoryFromDB(), 2000);
            };

            const handleBatchAdd = (change) => {
                setBatchChanges(current => [...current, change].sort((first, second) => first.date.localeCompare(second.date)));
            };

            const handleMultipleBack = () => {
                setHasUnsavedMultipleChanges(false);
                setBatchChanges([]);
                setBatchSessionKey(current => current + 1);
                setActiveView("home");
            };

            const handleRestoreBatchDraft = (restoredChanges) => {
                setBatchChanges(
                    restoredChanges.slice().sort((first, second) => first.date.localeCompare(second.date))
                );
            };

            const handleBatchSubmit = async () => {
                if (batchChanges.length === 0 || batchChanges.some(change => !change.person)) return;
                const scheduleConflict = findFirstScheduleConflict(batchChanges);
                if (scheduleConflict) {
                    setToast({
                        message: "Error: Existe conflicto de cruce de horarios. Ya has agregado el turno de " + formatShiftLabel(scheduleConflict.previous.type) + " para esta fecha.",
                        type: "error"
                    });
                    return;
                }
                setIsSubmitting(true);
                try {
                    await sendChangesToBackend(batchChanges, "multiple");
                    setToast({ message: batchChanges.length + " solicitud(es) guardada(s) correctamente.", type: "success" });
                    try {
                        await backendPost({ action: "deleteDraft", email: user.email });
                    } catch (draftError) {
                        console.warn("No se pudo limpiar el borrador remoto", draftError);
                    }
                    window.localStorage.removeItem(getMultipleDraftStorageKey(user));
                    setHasUnsavedMultipleChanges(false);
                    setBatchChanges([]);
                    setBatchSessionKey(current => current + 1);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al guardar los cambios múltiples.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleSubmit = () => {
                const errorsByShift = {};
                shifts.forEach(shift => {
                    const errors = getShiftFieldErrors(shift);
                    if (shift.room && !isRoomNotRequiredForType(shift.type)) {
                        const restriction = getRoomRestriction(shift.room, shift.date, shift.person, doctorsList);
                        if (restriction || !isRoomAvailableOnDate(shift.room, shift.date)) errors.room = restriction || "La sala no está disponible para esta fecha";
                    }
                    if (Object.keys(errors).length > 0) errorsByShift[shift.id] = errors;
                });

                if (Object.keys(errorsByShift).length > 0) {
                    setShiftFieldErrors(errorsByShift);
                    setIndividualValidationCycle(current => current + 1);
                    setValidationError("Faltan campos por diligenciar en uno o más turnos.");
                    setToast({ message: "Completa todos los campos obligatorios.", type: "error" });
                    scrollToFirstValidationError(document.querySelector(".individual-changes-view"));
                    return;
                }

                const individualShifts = shifts.flatMap(shift => {
                    const dates = [shift.date, ...(shift.repeatToOtherDates ? (shift.additionalDates || []) : [])];
                    return [...new Set(dates)].map(date => ({ ...shift, date }));
                });

                setShiftFieldErrors({});
                setValidationError("");
                setIndividualSubmitSummary({
                    groups: shifts.length,
                    changes: individualShifts
                });
            };

            const confirmIndividualSubmit = async () => {
                if (!individualSubmitSummary || individualSubmitSummary.changes.length === 0) return;
                const individualShifts = individualSubmitSummary.changes;
                setIndividualSubmitSummary(null);
                setIsSubmitting(true);
                try {
                    await sendChangesToBackend(individualShifts, "individual");
                    setToast({ message: individualShifts.length + " solicitud(es) guardada(s) correctamente.", type: "success" });
                    setShifts([{ id: Date.now().toString(), person: "", type: "", date: "", room: "", repeatToOtherDates: false, additionalDates: [] }]);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al guardar.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            // El historial conserva filas independientes; estas acciones solo agrupan la selección visual.
            const handleSelectIds = (rowIds, isChecked) => {
                setSelectedHistory(current => {
                    const next = new Set(current);
                    rowIds.forEach(rowId => {
                        if (isChecked) next.add(rowId);
                        else next.delete(rowId);
                    });
                    return Array.from(next);
                });
            };

            const executeCancel = async () => {
                setIsCancelling(true);
                try {
                    const shiftsToCancel = history.filter(h => selectedHistory.includes(h.rowId));
                    const payload = {
                        action: 'cancelShifts',
                        solicitante: user.name,
                        correoSolicitante: user.email,
                        shifts: shiftsToCancel
                    };
                    
                    const result = await backendPost(payload);
                    if (result.status && result.status !== "success") throw new Error(result.message || "No se pudo cancelar");
                    
                    setToast({ message: "Turno(s) cancelado(s) correctamente.", type: "success" });
                    setShowCancelModal(false);
                    setSelectedHistory([]);
                    refreshHistoryAfterWrite();
                } catch (error) {
                    setToast({ message: "Error al cancelar los turnos.", type: "error" });
                } finally {
                    setIsCancelling(false);
                }
            };


            const AnimatePresence = motionEnabled && window.Motion ? window.Motion.AnimatePresence : null;
            const requestView = activeView === 'home' ? (
                <MotionView key="home" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                    <DashboardChoices onChoose={setActiveView} />
                </MotionView>
            ) : activeView === 'individual' ? (
                <MotionView key="individual" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                        <section className="individual-changes-view bg-white rounded-2xl shadow-sm border border-slate-200 overflow-visible">
                            <div className="bg-keralty-blue px-6 py-4 flex items-center justify-between rounded-t-xl">
                                <div className="flex items-center"><span className="text-keralty-green mr-2"><IconFileText /></span><h2 className="text-lg font-semibold text-white">Nuevas Solicitudes</h2></div>
                                <button type="button" onClick={() => setActiveView('home')} className="text-sm text-white/90 hover:text-white font-medium">Volver</button>
                            </div>
                            <div className="p-6 bg-slate-50 rounded-b-xl">
                                {shifts.map((shift, idx) => <ShiftEntry key={shift.id} shift={shift} index={idx} updateShift={updateShift} removeShift={removeShift} doctorsList={doctorsList} isLoadingDoctors={isLoadingDoctors} errors={shiftFieldErrors[shift.id] || {}} validationCycle={individualValidationCycle}/>)}
                                <div className="mt-4 flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
                                    <button onClick={addShift} className="flex items-center text-keralty-blue font-medium px-4 py-2 border border-dashed border-keralty-blue hover:bg-blue-50 rounded-lg justify-center transition-colors"><span className="mr-1"><IconPlus /></span> Agregar otro</button>
                                    <div className="flex flex-col items-end w-full sm:w-auto">
                                        {validationError && <div className="text-red-500 text-sm font-bold mb-2 animate-bounce-short">{validationError}</div>}
                                        <button onClick={handleSubmit} disabled={isSubmitting} aria-disabled={!isIndividualComplete} className={`w-full sm:w-auto flex items-center justify-center px-6 py-3 rounded-xl font-medium transition-all ${isIndividualComplete ? "save-ready" : "save-incomplete"}`}>
                                            {isSubmitting ? <IconRefresh className="animate-spin mr-2" /> : <span className="mr-2"><IconSave /></span>} Guardar y enviar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>


                </MotionView>
            ) : (
                <MotionView key="multiple" enabled={motionEnabled} initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -8 }} transition={{ duration: 0.24 }}>
                    <MultipleChangesForm
                        doctorsList={doctorsList}
                        isLoadingDoctors={isLoadingDoctors}
                        changes={batchChanges}
                        onAdd={handleBatchAdd}
                        onRemove={(id) => setBatchChanges(current => current.filter(change => change.id !== id))}
                        onRemoveLot={(lotId) => setBatchChanges(current => current.filter(change => change.lotId !== lotId))}
                        onSubmit={handleBatchSubmit}
                        onRestoreDraft={handleRestoreBatchDraft}
                        onDirtyChange={setHasUnsavedMultipleChanges}
                        ownerEmail={user ? user.email : ""}
                        ownerName={user ? user.name : ""}
                        isSubmitting={isSubmitting}
                        motionEnabled={motionEnabled}
                        onBack={handleMultipleBack}
                        setToast={setToast}
                        resetKey={batchSessionKey}
                    />
                </MotionView>
            );

            // RENDERIZADO DEL SPLASH SCREEN
            if (showSplash) {
                return (
                    <div className={`fixed inset-0 z-[9999] bg-white flex flex-col items-center justify-center transition-opacity duration-500 ease-in-out ${fadeSplash ? 'opacity-0' : 'opacity-100'}`}>
                        <div className="animate-bounce-short">
                            <img src="https://lh3.googleusercontent.com/d/1R09YUf7Fk8OS4nA2603qtIsEqRr9CxXb" alt="Keralty" className="h-20 object-contain mb-4" />
                        </div>
                        <h1 className="text-4xl font-bold text-keralty-blue animate-fade-in">TurnoSync</h1>
                        <p className="text-slate-500 mt-2 font-medium animate-fade-in" style={{ animationDelay: '0.2s' }}>Gestión de Turnos</p>
                        <div className="mt-10 w-10 h-10 border-4 border-slate-200 border-t-keralty-green rounded-full animate-spin"></div>
                    </div>
                );
            }

            if (isPendingApproval) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 py-8 bg-slate-100">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-amber-400 animate-fade-in">
                            <div className="mx-auto w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mb-6">
                                <IconClock size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-4">Autorización Pendiente</h2>
                            <p className="text-slate-600 mb-6 leading-relaxed">
                                Tu cuenta ha sido registrada correctamente. <strong className="text-slate-800 block mt-2">Una vez el administrador le dé acceso se le enviará un correo indicando que ya puede entrar.</strong>
                            </p>
                            <button onClick={() => window.location.reload()} className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-slate-700 bg-slate-50 hover:bg-slate-200 border border-slate-200 transition-colors">
                                <IconRefresh size={18} className="mr-2" /> Recargar página
                            </button>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 py-8 bg-slate-100">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-keralty-green transition-all">
                            <img src="https://lh3.googleusercontent.com/d/1R09YUf7Fk8OS4nA2603qtIsEqRr9CxXb" alt="Keralty" className="h-12 mx-auto mb-6 object-contain" />
                            <h2 className="text-3xl font-bold text-keralty-blue">Ayudantes CUC/PA</h2>
                            <p className="text-slate-500 mt-2 mb-6">Portal de Gestión Cambios de Turno</p>
                            
                            {authMode === 'register' ? (
                                <form onSubmit={handleRegister} className="space-y-4 text-left animate-fade-in">
                                    <h3 className="font-bold text-lg text-slate-700 text-center mb-4">Crear una cuenta nueva</h3>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconUser size={16} className="mr-1"/> Nombre completo</label><input required type="text" placeholder="Ej. Juan Pérez" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconMail size={16} className="mr-1"/> Correo electrónico</label><input required type="email" placeholder="juan@ejemplo.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconPhone size={16} className="mr-1"/> Teléfono celular</label><input required type="tel" placeholder="300 123 4567" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconLock size={16} className="mr-1"/> Contraseña</label><input required minLength="6" type="password" placeholder="••••••••" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconLock size={16} className="mr-1"/> Confirmar Contraseña</label><input required minLength="6" type="password" placeholder="••••••••" value={formData.confirmPassword} onChange={e => setFormData({...formData, confirmPassword: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <button type="submit" disabled={isLoggingIn} className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-white bg-keralty-green hover:opacity-90 transition-opacity disabled:opacity-70 mt-6">{isLoggingIn ? <IconRefresh className="animate-spin mr-2" /> : null} Crear cuenta e ingresar</button>
                                    <p className="text-sm text-center text-slate-500 mt-4">¿Ya tienes cuenta? <button type="button" onClick={() => { setAuthMode('login'); setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' }); setShowEmailLogin(false); }} className="text-keralty-blue font-semibold hover:underline focus:outline-none">Inicia sesión</button></p>
                                </form>
                            ) : authMode === 'forgot' ? (
                                <form onSubmit={handleResetPassword} className="space-y-4 text-left animate-fade-in">
                                    <h3 className="font-bold text-lg text-slate-700 text-center mb-2">Recuperar contraseña</h3>
                                    <p className="text-sm text-slate-500 text-center mb-4">Ingresa tu correo y te enviaremos una contraseña temporal nueva.</p>
                                    <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconMail size={16} className="mr-1"/> Correo electrónico</label><input required type="email" placeholder="correo@ejemplo.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                    <button type="submit" disabled={isLoggingIn} className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 transition-colors disabled:opacity-70 mt-6">{isLoggingIn ? <IconRefresh className="animate-spin mr-2" /> : null} Enviar nueva contraseña</button>
                                    <p className="text-sm text-center text-slate-500 mt-4"><button type="button" onClick={() => { setAuthMode('login'); setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' }); setShowEmailLogin(false); }} className="text-keralty-blue font-semibold hover:underline focus:outline-none">Volver al inicio de sesión</button></p>
                                </form>
                            ) : (
                                <div className="space-y-5 animate-fade-in">
                                    <div className="bg-blue-50 p-4 rounded-lg text-sm text-keralty-blue text-left border border-blue-100"><p className="font-semibold mb-1 flex items-center"><IconAlert /> <span className="ml-2">Acceso Restringido</span></p>Inicia sesión para acceder al sistema.</div>
                                    <div className="flex justify-center min-h-[44px]">
                                        {isLoggingIn ? <button disabled className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-white bg-slate-400"><IconRefresh className="animate-spin mr-2" /> Validando...</button> : <div id="googleSignInDiv" className="w-full flex justify-center"></div>}
                                    </div>
                                    
                                    {!showEmailLogin ? (
                                        <div className="relative flex items-center py-6 cursor-pointer group" onClick={() => setShowEmailLogin(true)}>
                                            <div className="flex-grow border-t border-slate-200 transition-colors group-hover:border-slate-300"></div>
                                            <span className="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase font-semibold tracking-wider transition-colors group-hover:text-keralty-blue flex items-center">
                                                O con tu correo
                                                <span className="ml-1"><IconChevronDown size={14} /></span>
                                            </span>
                                            <div className="flex-grow border-t border-slate-200 transition-colors group-hover:border-slate-300"></div>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="relative flex items-center py-2">
                                                <div className="flex-grow border-t border-slate-200"></div>
                                                <span className="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase font-semibold tracking-wider">iniciar sesión con correo</span>
                                                <div className="flex-grow border-t border-slate-200"></div>
                                            </div>
                                            <form onSubmit={handleEmailLogin} className="space-y-4 text-left animate-fade-in">
                                                <div><label className="text-sm font-medium text-slate-600 flex items-center"><IconMail size={16} className="mr-1"/> Correo electrónico</label><input required type="email" placeholder="correo@ejemplo.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full mt-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" /></div>
                                                <div>
                                                    <div className="flex justify-between items-center mb-1">
                                                        <label className="text-sm font-medium text-slate-600 flex items-center"><IconLock size={16} className="mr-1"/> Contraseña</label>
                                                        <button type="button" onClick={() => { setAuthMode('forgot'); setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' }); }} className="text-xs text-keralty-blue font-semibold hover:underline focus:outline-none">¿Olvidaste tu contraseña?</button>
                                                    </div>
                                                    <input required type="password" placeholder="••••••••" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" />
                                                </div>
                                                <button type="submit" disabled={isLoggingIn} className="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-sm text-sm font-medium text-white bg-keralty-blue hover:bg-blue-900 transition-colors disabled:opacity-70">{isLoggingIn ? <IconRefresh className="animate-spin mr-2" /> : null} Ingresar</button>
                                            </form>
                                            <p className="text-sm text-center text-slate-500 mt-4 animate-fade-in">¿No tienes cuenta? <button type="button" onClick={() => { setAuthMode('register'); setFormData({ name: '', email: '', phone: '', password: '', confirmPassword: '' }); setShowEmailLogin(false); }} className="text-keralty-green font-semibold hover:underline focus:outline-none">Regístrate aquí</button></p>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                        
                        <InstallPrompt />
                    </div>
                );
            }

            return (
                <div className="pb-10">
                    <header className="bg-white shadow-sm sticky top-0 z-10 border-b-[3px] border-keralty-green">
                        <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <img src="https://lh3.googleusercontent.com/d/1R09YUf7Fk8OS4nA2603qtIsEqRr9CxXb" alt="Keralty Logo" className="h-8 object-contain" />
                                <div className="h-8 w-[1px] bg-slate-200 hidden sm:block"></div>
                                <h1 className="text-xl font-bold text-keralty-blue hidden sm:block">Gestión Cambios de Turno</h1>
                            </div>
                            <div className="flex items-center space-x-4">
                                <div className="hidden md:block text-right"><p className="text-sm font-medium text-keralty-blue">{user.name}</p></div>
                                <div className="h-10 w-10 bg-blue-50 text-keralty-blue rounded-full flex items-center justify-center overflow-hidden border border-blue-100">
                                    {user.photoUrl ? <img src={user.photoUrl} alt="Perfil" className="w-full h-full object-cover" /> : <IconUserCircle />}
                                </div>
                                {!user.photoUrl && (
                                    <button onClick={() => setShowPasswordModal(true)} title="Cambiar contraseña" className="text-slate-400 hover:text-keralty-blue transition-colors">
                                        <IconKey />
                                    </button>
                                )}
                                <button onClick={handleLogout} title="Cerrar sesión" className="text-slate-400 hover:text-red-600 transition-colors"><IconLogOut /></button>
                            </div>
                        </div>
                    </header>

                    {/* Modal para cambiar contraseña */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-fade-in">
                                <div className="bg-keralty-blue px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-white font-semibold flex items-center"><IconKey size={18} className="mr-2"/> Cambiar Contraseña</h3>
                                    <button onClick={() => setShowPasswordModal(false)} className="text-slate-300 hover:text-white text-2xl leading-none">×</button>
                                </div>
                                <form onSubmit={handleChangePassword} className="p-6 space-y-4">
                                    <div>
                                        <label className="text-sm font-medium text-slate-600 block mb-1">Contraseña Actual</label>
                                        <input required type="password" value={passwordData.old} onChange={e => setPasswordData({...passwordData, old: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium text-slate-600 block mb-1">Nueva Contraseña</label>
                                        <input required minLength="6" type="password" value={passwordData.new} onChange={e => setPasswordData({...passwordData, new: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium text-slate-600 block mb-1">Confirmar Nueva Contraseña</label>
                                        <input required minLength="6" type="password" value={passwordData.confirm} onChange={e => setPasswordData({...passwordData, confirm: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-keralty-blue outline-none" />
                                    </div>
                                    <div className="pt-2 flex space-x-3">
                                        <button type="button" onClick={() => setShowPasswordModal(false)} className="flex-1 py-2.5 rounded-lg font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</button>
                                        <button type="submit" disabled={isSubmitting} className="flex-1 py-2.5 rounded-lg font-medium text-white bg-keralty-green hover:opacity-90 transition-opacity disabled:opacity-70 flex justify-center items-center">
                                            {isSubmitting ? <IconRefresh className="animate-spin h-5 w-5" /> : "Guardar"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {individualSubmitSummary && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center animate-fade-in">
                                <div className="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <IconSave size={28} />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">Confirma el envío</h3>
                                <p className="text-sm text-slate-500">Se procesarán:</p>
                                <p className="mt-3 mb-6 text-lg font-bold text-keralty-blue">{individualSubmitSummary.groups} grupo(s) · {individualSubmitSummary.changes.length} cambio(s)</p>
                                <div className="flex flex-col-reverse sm:flex-row gap-3">
                                    <button type="button" onClick={() => setIndividualSubmitSummary(null)} className="button-press flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Seguir editando</button>
                                    <button type="button" onClick={confirmIndividualSubmit} className="button-press flex-1 py-2.5 bg-keralty-green text-white rounded-lg font-medium hover:opacity-90">Confirmar y enviar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Advertencia antes de cerrar sesión con cambios múltiples sin guardar */}
                    {showLogoutWarning && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 text-center animate-fade-in">
                                <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <IconAlert size={28} />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">¿Cerrar sesión sin guardar?</h3>
                                <p className="text-sm text-slate-500 mb-6">Tienes cambios múltiples o grupos que no se han guardado. Si cierras sesión ahora, esas modificaciones se perderán.</p>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowLogoutWarning(false)} className="button-press flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-lg font-medium hover:bg-slate-200">Seguir editando</button>
                                    <button type="button" onClick={completeLogout} className="button-press flex-1 py-2.5 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600">Cerrar sin guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Confirmación de Cancelar Turnos */}
                    {showCancelModal && (
                        <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-fade-in p-6 text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <IconAlert size={32} />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">¿Eliminar {selectedHistory.length} cambio(s)?</h3>
                                <p className="text-sm text-slate-500 mb-6">Esta acción no se puede deshacer. Se enviará un correo a los médicos involucrados y al administrador indicando que anulaste el turno.</p>
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowCancelModal(false)} disabled={isCancelling} className="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-medium hover:bg-slate-200 transition-colors disabled:opacity-50">Mantener</button>
                                    <button onClick={executeCancel} disabled={isCancelling} className="flex-1 py-2.5 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600 transition-colors flex justify-center items-center">
                                        {isCancelling ? <IconRefresh className="animate-spin h-5 w-5" /> : "Sí, Eliminar"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="max-w-5xl mx-auto px-4 mt-8 space-y-8">
                        {AnimatePresence ? <AnimatePresence mode="wait">{requestView}</AnimatePresence> : requestView}
<HistorySection
                            history={history}
                            isLoading={isLoadingHistory}
                            show={showHistory}
                            onToggle={handleHistoryToggle}
                            selectedIds={selectedHistory}
                            onSelectIds={handleSelectIds}
                            onRequestDelete={() => setShowCancelModal(true)}
                            motionEnabled={motionEnabled}
                        />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
