<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://accounts.google.com" crossorigin>
    <title>TurnoSync - Gestión Cambios de Turno</title>
    
    <link rel="icon" type="image/png" href="./icon-192x192-optimized.png">
    <link rel="apple-touch-icon" href="./icon-192x192-optimized.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TurnoSync">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">
    <script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
        <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .button-press, button, [role="button"] { -webkit-tap-highlight-color: transparent; }
        .button-press, button { transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
        .button-press:active, button:active { transform: scale(0.97); }
        .action-card { position: relative; overflow: hidden; transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease; }
        .action-card::after { content: ""; position: absolute; inset: 0; background: rgba(140, 198, 63, 0.08); opacity: 0; transition: opacity 180ms ease; pointer-events: none; }
        .action-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px -15px rgba(0, 40, 85, 0.38); border-color: #8CC63F; }
        .action-card:hover::after { opacity: 1; }
        .loading-dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 999px; background: #8CC63F; animation: loadingDot 1s infinite ease-in-out; }
        .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
        .draft-save-button { transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, box-shadow 220ms ease, transform 160ms ease; }
        .draft-save-button-success { background-color: #dcfce7 !important; border-color: #8CC63F !important; color: #166534 !important; box-shadow: 0 0 0 3px rgba(140, 198, 63, 0.18); }
        .multiple-panel { background: #ffffff; border: 1px solid #dbe3ec; border-radius: 8px; box-shadow: 0 8px 22px -18px rgba(0, 40, 85, 0.55); }
        .multiple-panel-title { display: flex; align-items: center; gap: 0.55rem; color: #002855; font-weight: 700; }
        .group-status { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; line-height: 1.1; }
        .transfer-indicator { position: absolute; right: 1.25rem; bottom: -0.75rem; z-index: 5; width: 2.35rem; height: 2.35rem; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #8CC63F; color: white; box-shadow: 0 8px 18px rgba(0, 40, 85, 0.22); pointer-events: none; animation: transferToVerification 680ms ease-out forwards; }
        @keyframes transferToVerification { 0% { opacity: 0; transform: translateY(-22px) scale(0.78); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(62px) scale(1.05); } }
        .field-error { border-color: #ef4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.13) !important; }
        .field-error-shake { animation: fieldErrorShake 420ms ease-in-out; }
        .save-ready { background-color: #16a34a !important; color: #ffffff !important; box-shadow: 0 8px 18px -10px rgba(22, 163, 74, 0.75); }
        .save-incomplete { background-color: #94a3b8 !important; color: #ffffff !important; opacity: 0.68; }
        @keyframes fieldErrorShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
        @keyframes loadingDot { 0%, 80%, 100% { transform: scale(0.55); opacity: 0.45; } 40% { transform: scale(1); opacity: 1; } }
        @media (max-width: 640px) {
            body { font-size: 14px; }
            .text-sm, select, input, textarea, button { font-size: 0.8125rem !important; }
            .text-xs { font-size: 0.7rem !important; }
            .text-lg { font-size: 1rem !important; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="./app.js" defer></script>
</body>
</html>
